# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. crosslink)
component: config

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Improve sourcetype assignment in Linux log collection config to better replicate Splunk TA for *nix behavior

# One or more tracking issues related to the change
issues: [7843]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  - Replace hardcoded `linux:varlog` sourcetype with dynamic filename-based assignment (e.g. `auth.log` -> `auth`, `syslog` -> `syslog`) matching Splunk's default behavior
  - Add `transform/nix_sourcetype` overrides for `auth.log` -> `syslog` (replicating Splunk `LEARN_SOURCETYPE`), `config_file` extensions, and correct `\\.filename$` path patterns
  - Change `bash_history` sourcetype from `linux:bash_history` to `bash_history` to match TA `inputs.conf`
  - Exclude vim swap files (`*.swp`, `*.swx`) from `file_log/varlog` to prevent binary file ingestion
