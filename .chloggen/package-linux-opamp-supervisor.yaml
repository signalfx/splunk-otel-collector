# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: new_component

# The name of the component, or a single word describing the area of concern, (e.g. crosslink)
component: packaging

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add opt-in OpAMP Supervisor support to Linux DEB, RPM, and TAR packages.

# One or more tracking issues related to the change
issues: [7897]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  By default, the launcher runs the collector directly, preserving existing service behavior.
  When enabled, the launcher starts the OpAMP Supervisor to manage the collector process
  and apply configuration updates from Splunk Observability Cloud.
  Enable supervisor mode by either:
  - During install, pass `--with-supervisor` to the installer script
  - After upgrade, set `SPLUNK_OPAMP_SUPERVISOR_ENABLED=true` in the service environment and restart the service
