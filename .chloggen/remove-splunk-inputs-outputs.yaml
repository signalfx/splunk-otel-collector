change_type: breaking
component: splunk_inputs, splunk_outputs
note: Remove the `splunk_inputs` receiver and `splunk_outputs` exporter. Reading a Splunk `.conf` tree is now done by the `splunkconf` config provider, so pass `--config=splunkconf://<config-root>` instead of configuring these components in YAML.
issues: [8123]
subtext: |
  The config root is the `etc` directory of the tree these components took as `base_dir`. The
  `enableTARunner` feature gate is still required. The provider does not watch files, so reload
  now happens on `SIGHUP` or an OpAMP-pushed config rather than automatically on file change.
  See `docs/deprecations/splunk-inputs-outputs.md` for the full migration, including known
  differences.
