# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. crosslink)
component: splunkconf

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add NewMappingReceiver and NewMappingExporter so a component does not declare a factory struct to carry its mapping

# One or more tracking issues related to the change
issues: []

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  Satisfying `MappingReceiverFactory` meant embedding `receiver.Factory` in a
  struct purely to hang `MapInputs` on, and returning that concrete type from
  the constructor: returning `receiver.Factory` compiled while satisfying
  nothing, and the mistake only surfaced where the factory was registered. The
  helpers take the factory and the mapping as a function, and the in-repo
  components now use them.
