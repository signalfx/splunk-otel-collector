codecov:
  notify:
    require_ci_to_pass: yes
    # wait for unit and integration test builds.
    after_n_builds: 2
  strict_yaml_branch: main  # only use the latest copy on main branch

# Test modules still run and cover the main code; drop their own source from the report.
ignore:
  - "tests"
  - "packaging/tests"

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default:
        enabled: yes
        target: 30%
    patch:
      default:
        enabled: yes
        target: 85%
