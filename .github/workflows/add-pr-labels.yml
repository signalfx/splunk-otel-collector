name: 'Add labels to a PR'
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - ready_for_review

permissions: read-all

jobs:
  add-labels-to-pr:
    permissions:
      pull-requests: write
    runs-on: ubuntu-slim
    if: ${{ github.actor != 'dependabot[bot]' && github.repository_owner == 'signalfx' && github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run add-codeowners-to-pr.sh
        run: ./.github/workflows/scripts/add-codeowners-to-pr.sh
        env:
          PR: ${{ github.event.number }}
