name: auto-instrumentation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/auto-instrumentation.yml'
      - 'cmd/otelcol/**'
      - 'instrumentation/**'
      - 'internal/**'
      - '!**.md'
      - 'packaging/**'
      - 'tests/go.mod'
      - 'tests/go.sum'
      - 'tests/instrumentation/**'
      - 'tests/testutils/**'

concurrency:
  group: auto-instrumentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.6

jobs:
  cross-compile:
    strategy:
      matrix:
        SYS_BINARIES: [ "binaries-linux_amd64", "binaries-linux_arm64" ]
    uses: ./.github/workflows/reusable-compile.yml
    with:
      SYS_BINARY: ${{ matrix.SYS_BINARIES }}

  build-package:
    strategy:
      matrix:
        SYS_PACKAGE: [ "deb", "rpm" ]
        ARCH: [ "amd64", "arm64"]
    uses: ./.github/workflows/reusable-build-instrumentation-package.yml
    with:
      SYS_PACKAGE: ${{ matrix.SYS_PACKAGE }}
      ARCH: ${{ matrix.ARCH }}

  test-package-matrix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get matrix
        id: get-matrix
        run: |
          # create test matrix for distro and arch
          dockerfiles=$(find packaging/tests/instrumentation/images -name "Dockerfile.*" | cut -d '.' -f2- | sort -u)
          if [ -z "$dockerfiles" ]; then
            echo "Failed to get dockerfiles from packaging/tests/instrumentation/images!" >&2
            exit 1
          fi
          distro=$(for d in $dockerfiles; do echo -n "\"$d\","; done)
          arch="\"amd64\", \"arm64\""
          testcase="\"express\",\"tomcat\",\"dotnet\""
          excluded_distros="centos-8 oraclelinux-8 rockylinux-8"
          exclude=$(for d in $excluded_distros; do echo -n "{\"DISTRO\": \"$d\", \"ARCH\": \"arm64\", \"TESTCASE\": \"dotnet\"},"; done)
          matrix="{\"DISTRO\": [${distro%,}], \"ARCH\": [${arch}], \"TESTCASE\": [${testcase}], \"exclude\": [${exclude%,}]}"
          echo "$matrix" | jq
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.get-matrix.outputs.matrix }}

  test-package:
    runs-on: ubuntu-24.04${{ matrix.ARCH == 'arm64' && '-arm' || '' }}
    timeout-minutes: 60
    needs: [cross-compile, build-package, test-package-matrix]
    strategy:
      matrix: ${{ fromJSON(needs.test-package-matrix.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get package type for ${{ matrix.DISTRO }}
        run: |
          for pkg in "deb" "rpm"; do
            if [[ -f "packaging/tests/instrumentation/images/${pkg}/Dockerfile.${{ matrix.DISTRO }}" ]]; then
              echo "SYS_PACKAGE=${pkg}" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Unknown distro '${{ matrix.DISTRO }}'!"
          exit 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-linux_${{ matrix.ARCH }}
          path: ./bin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: splunk-otel-auto-instrumentation-${{ matrix.ARCH }}-${{ env.SYS_PACKAGE }}
          path: ./instrumentation/dist

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: 'tests/go.sum'

      - name: Test ${{ env.SYS_PACKAGE }} on ${{ matrix.DISTRO }} ${{ matrix.ARCH }}
        id: go-test
        continue-on-error: true
        working-directory: tests
        run: |
          distro="${{ matrix.DISTRO }}"
          arch="${{ matrix.ARCH }}"
          case "${{ matrix.TESTCASE }}" in
            tomcat) test_name="TestTomcatInstrumentation" ;;
            express) test_name="TestExpressInstrumentation" ;;
            dotnet) test_name="TestDotnetInstrumentation" ;;
            *) echo "Unknown instrumentation test case '${{ matrix.TESTCASE }}'" >&2; exit 1 ;;
          esac
          test_result=0
          PACKAGE_TEST_TYPE="$SYS_PACKAGE" \
          PACKAGE_TEST_DISTRO="$distro" \
          PACKAGE_TEST_ARCH="$arch" \
          go test -tags integration -v -timeout 40m -count 1 ./instrumentation \
            -run "^${test_name}/${distro}/${arch}$" || test_result=1
          PACKAGE_TEST_TYPE="$SYS_PACKAGE" \
          PACKAGE_TEST_DISTRO="$distro" \
          PACKAGE_TEST_ARCH="$arch" \
          go test -tags integration -v -timeout 15m -count 1 ./instrumentation \
            -run "^TestPackage(Uninstall|UpgradeFromLibsplunk)/${distro}/${arch}$" || test_result=1
          exit "$test_result"

      # networking, running systemd in containers, etc., can be flaky
      - name: Re-run failed tests
        if: ${{ steps.go-test.outcome == 'failure' }}
        working-directory: tests
        run: |
          distro="${{ matrix.DISTRO }}"
          arch="${{ matrix.ARCH }}"
          case "${{ matrix.TESTCASE }}" in
            tomcat) test_name="TestTomcatInstrumentation" ;;
            express) test_name="TestExpressInstrumentation" ;;
            dotnet) test_name="TestDotnetInstrumentation" ;;
            *) echo "Unknown instrumentation test case '${{ matrix.TESTCASE }}'" >&2; exit 1 ;;
          esac
          test_result=0
          PACKAGE_TEST_TYPE="$SYS_PACKAGE" \
          PACKAGE_TEST_DISTRO="$distro" \
          PACKAGE_TEST_ARCH="$arch" \
          go test -tags integration -v -timeout 40m -count 1 ./instrumentation \
            -run "^${test_name}/${distro}/${arch}$" || test_result=1
          PACKAGE_TEST_TYPE="$SYS_PACKAGE" \
          PACKAGE_TEST_DISTRO="$distro" \
          PACKAGE_TEST_ARCH="$arch" \
          go test -tags integration -v -timeout 15m -count 1 ./instrumentation \
            -run "^TestPackage(Uninstall|UpgradeFromLibsplunk)/${distro}/${arch}$" || test_result=1
          exit "$test_result"
