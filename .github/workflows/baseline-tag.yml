# On merge to main, tags baseline/<VERSION> if absent. No-op if the tag exists
# and matches; fails if it exists but the baseline tree differs.

name: baseline-tag

on:
  push:
    branches:
      - main
    paths:
      - 'baseline/**/*.go'
      - 'baseline/go.mod'
      - 'baseline/go.sum'
      - 'baseline/VERSION'

permissions:
  contents: write

concurrency:
  group: baseline-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Tag baseline at VERSION
        env:
          GITHUB_BOT_GPG_KEY: ${{ secrets.GITHUB_BOT_GPG_KEY }}
          GITHUB_BOT_GPG_KEY_ID: ${{ secrets.GITHUB_BOT_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          source .github/workflows/scripts/baseline-version.sh

          version="$(read_version)"
          tag="baseline/${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            if baseline_shipping_changed "$tag"; then
              echo "::error::${tag} already exists but the baseline tree differs. An untagged baseline change reached main; bump baseline/VERSION."
              exit 1
            fi
            echo "${tag} already exists and matches HEAD; nothing to do."
            exit 0
          fi

          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'no-tty\npinentry-mode loopback\n' > ~/.gnupg/gpg.conf
          gpg --batch --allow-secret-key-import --import <(echo "$GITHUB_BOT_GPG_KEY")
          git config user.name release-bot
          git config user.email ssg-srv-gh-o11y-gdi@splunk.com
          git config user.signingKey "$GITHUB_BOT_GPG_KEY_ID"

          echo ">>> Creating signed tag ${tag} at $(git rev-parse HEAD) ..."
          git tag -s "$tag" -m "Release ${tag}"
          git push origin "$tag"
