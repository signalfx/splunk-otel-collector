# Auto-tags the baseline module on merge to main. When baseline's shipping files
# change, baseline/VERSION is read and a signed baseline/vX.Y.Z tag is created if
# it does not already exist. If the tag exists and its baseline tree matches, the
# run is a no-op (idempotent, like chart-releaser --skip-existing); if it exists
# but the tree differs, the run fails loudly (an untagged change slipped past the
# baseline-version-guard PR check).

name: baseline-tag

on:
  push:
    branches:
      - main
    paths:
      - 'baseline/**/*.go'
      - 'baseline/go.mod'
      - 'baseline/go.sum'
      - 'baseline/VERSION'

permissions:
  contents: write

concurrency:
  group: baseline-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Tag baseline at VERSION
        env:
          GITHUB_BOT_GPG_KEY: ${{ secrets.GITHUB_BOT_GPG_KEY }}
          GITHUB_BOT_GPG_KEY_ID: ${{ secrets.GITHUB_BOT_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          source .github/workflows/scripts/baseline-version.sh
          source .gitlab/common.sh

          version="$(read_version)"
          tag="baseline/${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            if baseline_shipping_changed "$tag"; then
              echo "::error::${tag} already exists but the baseline tree differs from it. An untagged baseline change reached main; bump baseline/VERSION."
              exit 1
            fi
            echo "${tag} already exists and matches HEAD; nothing to do."
            exit 0
          fi

          setup_gpg
          import_gpg_secret_key "$GITHUB_BOT_GPG_KEY"
          setup_git

          echo ">>> Creating signed tag ${tag} at $(git rev-parse HEAD) ..."
          git tag -s "$tag" -m "Release ${tag}"
          git push origin "$tag"
