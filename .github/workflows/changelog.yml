# This action requires that any PR targeting the main branch should add a
# yaml file to the ./.chloggen/ directory. If a CHANGELOG entry is not required,
# or if performing maintenance on the Changelog, add either \"[chore]\" to the title of
# the pull request or add the \"Skip Changelog\" label to disable this action.

name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.11

jobs:
  changelog-version:
    name: Ensure changelog version matches versions.yaml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Check changelog version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- CHANGELOG.md; then
            echo "CHANGELOG.md was not modified; skipping version consistency check."
            exit 0
          fi

          # Extract the latest version from the CHANGELOG.md file using SED:
          # Explanation by line:
          #   - -nE suppresses unmatched lines and enables extended regular expressions.
          #   - The pattern prints version tokens from headings in CHANGELOG.md.
          #   - head keeps the first match, which is the latest version heading.
          changelog_version=$(
            sed -nE \
              's/^## (v[^[:space:]]+).*$/\1/p' \
              CHANGELOG.md |
              head -n 1
          )

          # Extract the `module-sets.splunk-otel-collector.version` field from versions.yaml.
          versions_version=$(yq '."module-sets"."splunk-otel-collector".version' versions.yaml)

          if [[ -z "$changelog_version" ]]; then
            echo "Could not find a version heading in CHANGELOG.md."
            exit 1
          fi

          if [[ -z "$versions_version" ]]; then
            echo "Could not find the splunk-otel-collector version in versions.yaml."
            exit 1
          fi

          if [[ "$changelog_version" != "$versions_version" ]]; then
            echo "The latest CHANGELOG.md version ($changelog_version) does not match the splunk-otel-collector version in versions.yaml ($versions_version)."
            exit 1
          fi

          echo "Latest changelog version matches versions.yaml: $versions_version"

  changelog:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'dependencies') && !contains(github.event.pull_request.labels.*.name, 'Skip Changelog') && !contains(github.event.pull_request.title, '[chore]')}}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Cache Go
        id: go-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
          key: changelog-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Ensure no changes to the CHANGELOG
        run: |
          if [[ "$(git diff --name-only "$(git merge-base origin/main ${{ github.event.pull_request.head.sha }})" ${{ github.event.pull_request.head.sha }} ./CHANGELOG.md)" ]]
          then
            echo "The CHANGELOG should not be directly modified."
            echo "Please add a .yaml file to the ./.chloggen/ directory."
            echo "Run make chlog-new to add a new changelog file."
            echo "Alternately, add either \"[chore]\" to the title of the pull request or add the \"Skip Changelog\" label if this job should be skipped."
            false
          else
            echo "The CHANGELOG was not modified."
          fi

      - name: Ensure ./.chloggen/*.yaml addition(s)
        run: |
          if [[ 1 -gt "$(git diff --diff-filter=A --name-only "$(git merge-base origin/main ${{ github.event.pull_request.head.sha }})" ${{ github.event.pull_request.head.sha }} ./.chloggen | grep -c \\.yaml)" ]]
          then
            echo "No changelog entry was added to the ./.chloggen/ directory."
            echo "Please add a .yaml file to the ./.chloggen/ directory."
            echo "Run make chlog-new to add a new changelog file."
            echo "Alternately, add either \"[chore]\" to the title of the pull request or add the \"Skip Changelog\" label if this job should be skipped."
            false
          else
            echo "A changelog entry was added to the ./.chloggen/ directory."
          fi

      - name: Validate ./.chloggen/*.yaml changes
        run: |
          make install-tools
          make chlog-validate \
            || { echo "New ./.chloggen/*.yaml file failed validation."; exit 1; }

      # In order to validate any links in the yaml file, render the config to markdown
      - name: Render .chloggen changelog entries
        run: make chlog-preview > changelog_preview.md
      - name: Link Checker
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'dependencies') && !contains(github.event.pull_request.title, '[chore]')}}
        id: lychee
        uses: lycheeverse/lychee-action@74c50ae9cb26a12ef66ad5769546fe0848ae9596 # f613c4a64e50d792e0b31ec34bbcbba12263c6a6
        with:
          args: "--verbose --no-progress ./changelog_preview.md --config .lychee.toml"
          failIfEmpty: false
