name: otlpintput

on:
  push:
    branches:
      - main
    paths:
      - 'packaging/otlpinput/**'
      - '.github/workflows/otlpinput.yaml'
      - 'cmd/splunk-connect-for-otlp/**'
      - 'internal/**'
      - 'pkg/**'
  pull_request:
    paths:
      - 'packaging/otlpinput/**'
      - '.github/workflows/otlpinput.yaml'
      - 'cmd/splunk-connect-for-otlp/**'
      - 'internal/**'
      - 'pkg/**'
  workflow_dispatch: {}

env:
  GO_VERSION: 1.26.9

jobs:
  ta-v2-build-packages:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Package Splunk Connect for OTLP
        working-directory: packaging/otlpinput
        run: |
          set -eo pipefail
          make tgz
          ls -l ./out/distribution

      - name: Upload Splunk Connect for OTLP artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otlpinput-packages
          path: packaging/otlpinput/out/distribution/*.tgz

      - name: Check no source files were modified
        run: |
          set -eo pipefail
          if ! git diff --exit-code; then
            echo "Source files were modified during the build. Please update the repository."
            exit 1
          fi

  # Checks that the modular input's TLS calls work against IP-literal
  # targets (see internal/auth/auth.go, and the server certificate in
  # packaging/otlpinput/example/generate-certs.sh).
  otlpinput-tls-ip-sans-test:
    needs: ta-v2-build-packages
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packaging/otlpinput/example
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Splunk Connect for OTLP artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otlpinput-packages
          path: packaging/otlpinput/out/distribution

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          install_tools: "false"

      - name: Run TLS IP SANs regression check
        env:
          OTLP_PACKAGE_PATH: ${{ github.workspace }}/packaging/otlpinput/out/distribution/splunk-connect-for-otlp.tgz
        run: |
          set -eo pipefail
          sh ./test-ip-sans.sh

      - name: Run HEC token pagination regression check
        env:
          OTLP_PACKAGE_PATH: ${{ github.workspace }}/packaging/otlpinput/out/distribution/splunk-connect-for-otlp.tgz
          TEST_HEC_PAGINATION: "1"
        run: |
          set -eo pipefail
          sh ./test-ip-sans.sh

  # Windows has no Splunk Docker image, so this only checks that the modular
  # input can be launched by a Splunk UF and starts without errors.
  otlpinput-smoke-test-windows:
    needs: ta-v2-build-packages
    runs-on: windows-latest
    env:
      APP_NAME: splunk-connect-for-otlp
    strategy:
      matrix:
        splunk_uf:
          - version: 9.4.0
            build_hash: 6b4ebe426ca6
          - version: 10.0.3
            build_hash: adbac1c8811c
    steps:
      - name: Download the Splunk UF MSI
        shell: bash
        run: |
          curl https://download.splunk.com/products/universalforwarder/releases/${{ matrix.splunk_uf.version }}/windows/splunkforwarder-${{ matrix.splunk_uf.version }}-${{ matrix.splunk_uf.build_hash }}-windows-x64.msi -o splunkforwarder.msi

      - name: Generate Splunk admin password
        id: gen_password
        shell: pwsh
        run: |
          $pw = [guid]::NewGuid().ToString()
          Write-Host "::add-mask::$pw"
          "splunk_password=$pw" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Splunk UF
        env:
          SPLUNK_PASSWORD: ${{ steps.gen_password.outputs.splunk_password }}
        run: msiexec.exe /i "$PWD\splunkforwarder.msi" /qn AGREETOLICENSE=Yes SPLUNKPASSWORD="$Env:SPLUNK_PASSWORD"

      - name: Configure Splunk UF management port for TCP access
        run: |
          # The universal forwarder defaults mgmtMode to "auto", which prefers a Unix Domain
          # Socket over TCP for the management port. The modular input calls back into the
          # management API at https://127.0.0.1:8089 on startup, so force TCP.
          $serverConfDir = "${Env:ProgramFiles}\SplunkUniversalForwarder\etc\system\local"
          New-Item -ItemType Directory -Path $serverConfDir -Force | Out-Null
          Add-Content -Path "$serverConfDir\server.conf" -Value "[httpServer]`nmgmtMode = tcp"

      - name: Download Splunk Connect for OTLP artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otlpinput-packages
          path: ${{ github.workspace }}/packaging/otlpinput/out/distribution

      - name: Install Splunk Connect for OTLP on the local Splunk UF
        shell: pwsh
        run: |
          $appsDir = "${Env:ProgramFiles}\SplunkUniversalForwarder\etc\apps"
          tar -xzf "${{ github.workspace }}/packaging/otlpinput/out/distribution/splunk-connect-for-otlp.tgz" -C $appsDir
          $localDir = "$appsDir\$Env:APP_NAME\local"
          New-Item -ItemType Directory -Path $localDir -Force | Out-Null
          # TLS is disabled so that the test doesn't need certificates.
          @"
          [splunk-connect-for-otlp://smoke_test]
          enableSSL = 0
          grpc_port = 4317
          http_port = 4318
          listen_address = 127.0.0.1
          "@ | Set-Content -Path "$localDir\inputs.conf"
          Get-Content "$localDir\inputs.conf"
          Get-ChildItem -Recurse "$appsDir\$Env:APP_NAME\windows_x86_64"

      - name: Restart Splunk UF
        run: |
          cd "${Env:ProgramFiles}\SplunkUniversalForwarder\bin"
          .\splunk.exe restart

      - name: Wait for the OTLP input to start
        shell: pwsh
        run: |
          $splunkdLog = "${Env:ProgramFiles}\SplunkUniversalForwarder\var\log\splunk\splunkd.log"
          $timeout = 300
          $elapsed = 0
          Write-Host -NoNewline "Waiting for 'OTLP Input started' on splunkd.log: "
          while (-not ((Test-Path $splunkdLog) -and (Select-String -Path $splunkdLog -Pattern "OTLP Input started" -Quiet))) {
              if ($elapsed -ge $timeout) {
                  Write-Host ""
                  Write-Host "Timeout: the OTLP input did not report a successful start within $timeout seconds" -ForegroundColor Red
                  exit 1
              }
              Start-Sleep -Seconds 2
              $elapsed += 2
              Write-Host -NoNewline "."
          }
          Write-Host ""
          Write-Host "OTLP input started after ~$elapsed seconds"

      - name: Check the OTLP input process is alive after 15 seconds
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          if (Get-Process -Name splunk-connect-for-otlp -ErrorAction SilentlyContinue) {
              Write-Host "splunk-connect-for-otlp process is still running."
          } else {
              Write-Host "splunk-connect-for-otlp process is not running!" -ForegroundColor Red
              exit 1
          }

      - name: Stop Splunk UF
        run: |
          cd "${Env:ProgramFiles}\SplunkUniversalForwarder\bin"
          .\splunk.exe stop

      - name: Show splunkd.log on failure
        if: failure()
        shell: pwsh
        run: |
          $splunkdLog = "${Env:ProgramFiles}\SplunkUniversalForwarder\var\log\splunk\splunkd.log"
          Write-Host "`n======= splunkd.log contents ======="
          Get-Content $splunkdLog -ErrorAction SilentlyContinue
