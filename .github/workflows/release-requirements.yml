name: release-requirements

on:
  pull_request:
    paths:
      - '.github/workflows/release-requirements.yml'
      - '.gitlab-ci.yml'
      - '.gitlab/**'
      - 'packaging/docker-otelcol.sh'
      - 'packaging/release/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-requirements:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'packaging/release/requirements.txt'

      - run: pip install -r packaging/release/requirements.txt

      - name: Test Docker release and recovery
        run: bash .gitlab/tests/collector-docker-release-test.sh

      - name: Test release cleanup
        run: python -B .gitlab/tests/collector-cleanup-test.py

      - name: Test MSI publication
        run: python -B -m unittest discover -s packaging/release -p test_msi_release.py
