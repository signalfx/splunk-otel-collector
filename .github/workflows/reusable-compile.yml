name: compile

on:
  workflow_call:
    inputs:
      SYS_BINARY:
        required: true
        type: string

env:
  GO_VERSION: 1.26.6
  MICROSOFT_GO_VERSION: 1.26.6-1

jobs:
  compile:
    name: compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment
        if: "!startsWith(inputs.SYS_BINARY, 'binaries-windows_')"
      - name: Set up Microsoft Go for Windows targets
        if: startsWith(inputs.SYS_BINARY, 'binaries-windows_')
        uses: ./.github/actions/setup-microsoft-go
        with:
          go-version: ${{ env.MICROSOFT_GO_VERSION }}

      - name: Build Collector
        run: |
          make ${{ inputs.SYS_BINARY }}

      - name: Verify Windows collector uses Microsoft system crypto
        if: startsWith(inputs.SYS_BINARY, 'binaries-windows_')
        run: |
          target="${{ inputs.SYS_BINARY }}"
          target="${target#binaries-}"
          go version -m "./bin/otelcol_${target}.exe" | grep -F 'microsoft_systemcrypto=1'

      - name: Uploading binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.SYS_BINARY }}
          path: |
            ./bin/*
