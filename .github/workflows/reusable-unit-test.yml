name: unit-test

on:
  workflow_call:
    inputs:
      OS:
        required: true
        type: string
      COVERAGE:
        required: false
        type: boolean
      TEST_RACE:
        required: false
        type: boolean

env:
  GO_VERSION: 1.26.6

jobs:
  unit-test:
    runs-on: ${{ inputs.OS }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report disk space before environment setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{Name='UsedGB'; Expression={[math]::Round($_.Used / 1GB, 2)}},
              @{Name='FreeGB'; Expression={[math]::Round($_.Free / 1GB, 2)}} |
            Format-Table -AutoSize

      - uses: ./.github/actions/setup-environment
        with:
          install_tools: 'false'

      - name: Install unit test reporting tool
        if: ${{ inputs.COVERAGE }}
        working-directory: ./internal/tools
        run: go install github.com/jstemmer/go-junit-report

      - name: Set CGO_ENABLED
        # Currently, CGO enabled is required for:
        # - race detection on non-macOS systems
        run: |
          if [[ "${{ inputs.OS }}" =~ ^mac ]] || [[ "${{ inputs.TEST_RACE }}" == "false" ]]; then
            echo "Disabling CGO"
            go env -w CGO_ENABLED=0
          else
            echo "Enabling CGO"
            go env -w CGO_ENABLED=1
          fi

      - name: bundle.d
        run: |
          make bundle.d
          if ! git diff --exit-code; then
            echo "Discovery bundle.d config has changed. Run 'make bundle.d' and push the changes or ensure correct .tmpl updated."
            exit 1
          fi

      - name: Report disk space before unit tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{Name='UsedGB'; Expression={[math]::Round($_.Used / 1GB, 2)}},
              @{Name='FreeGB'; Expression={[math]::Round($_.Free / 1GB, 2)}} |
            Format-Table -AutoSize

      - name: Unit tests
        run: |
          set -o pipefail
          export ENABLE_RACE_DETECTOR=${{ inputs.TEST_RACE }}
          if ${{ inputs.COVERAGE }}; then
            mkdir -p unit-test-results-${{ inputs.OS }}/junit
            trap "go-junit-report  -set-exit-code < unit-test-results-${{ inputs.OS }}/go-unit-tests.out > unit-test-results-${{ inputs.OS }}/junit/results.xml" EXIT
            COVER_TESTING=true make gotest-with-codecov | tee unit-test-results-${{ inputs.OS }}/go-unit-tests.out
          else
            make test-all
          fi

      - name: Report disk space after unit tests
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{Name='UsedGB'; Expression={[math]::Round($_.Used / 1GB, 2)}},
              @{Name='FreeGB'; Expression={[math]::Round($_.Free / 1GB, 2)}} |
            Format-Table -AutoSize

      - name: Uploading artifacts
        if: ${{ inputs.COVERAGE }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results-${{ inputs.OS }}
          path: ./unit-test-results-${{ inputs.OS }}

      - name: Upload coverage report
        if: ${{ inputs.COVERAGE }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          verbose: true
          slug: signalfx/splunk-otel-collector
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
