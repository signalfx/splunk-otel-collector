name: windows-test

on:
  push:
    branches:
      - main
  pull_request:

env:
  GO_VERSION: 1.26.6

concurrency:
  group: windows-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-test:
    name: windows-test
    runs-on: ${{ matrix.OS }}
    strategy:
      matrix:
        OS: [ "windows-2022", "windows-2025", "windows-11-arm" ]
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure required ports in the dynamic range are available
        run: |
          $ErrorActionPreference = 'Continue'
          & ${{ github.workspace }}\.github\workflows\scripts\win-required-ports.ps1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: '**/go.sum'

      - name: Unit tests with coverage
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOPATH = "${env:USERPROFILE}\go"
          $env:PATH = "$env:PATH;${env:GOPATH}\bin"
          go env -w CGO_ENABLED=0
          go test -v -cover ./...
