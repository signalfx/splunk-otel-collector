default:
  image: "${DOCKER_CICD_REPO}/ci-container/debian-bookworm:3.5.0"
  id_tokens:
    CI_JOB_JWT:
      aud:
        - "$CICD_VAULT_ADDR"
        - "$SECRETS_URL"

variables:
  RELEASE_VERSION:
    value: ""
    description: "Version to release (must be in format v1.2.3)"
  DRY_RUN:
    value: ""
    description: "Set to 'true' for a dry run. Docker publishing requires a protected branch and credentials scoped to the dev repositories."
  GO_VERSION: 1.26.11
  SPLUNKBASE_USERNAME: "srv-prod-gdi-otel"
  QUAY_COLLECTOR_REPO: quay.io/signalfx/splunk-otel-collector
  DOCKER_HUB_COLLECTOR_REPO: docker.io/splunk/otel-collector
  WIN_2019_BASE_IMAGE: mcr.microsoft.com/windows/servercore:ltsc2019
  WIN_2022_BASE_IMAGE: mcr.microsoft.com/windows/servercore:ltsc2022
  SPLUNK_OTELCOL_DOWNLOAD_BASE:
    value: "https://github.com/signalfx/splunk-otel-collector/releases/download"
    description: 'URL to download artifacts from'
  BUILD_DIR:
    value: '${CI_PROJECT_DIR}/build'
    description: 'in this CI, where builds are stored'
  CREDS_HELPER_ALLOW_LEGACY: "true"

include:
  - project: 'ci-cd/templates'
    ref: main
    file:
      - '/prodsec/.oss-scan.yml'
      - '/prodsec/.sast-scan.yml'
      - '/prodsec/.binary-scan.yml'
      - '/prodsec/.container-scan.yml'
  - project: 'core-ee/signing/api-integration'
    ref: develop
    file: '/templates/.sign-client.yml'


# Manual release job
manual_release_trigger:
  variables:
    GIT_DEPTH: 0
  script:
    - |
      set -euo pipefail

      if [ -z "$RELEASE_VERSION" ]; then
        echo "RELEASE_VERSION is not set. Cannot proceed." >&2
        exit 1
      fi

      # Validate version format (must be v1.2.3 or v1.2.3-rc.0 or v1.2.3-beta.1)
      if ! echo "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\-(beta|rc)\.[0-9]+)?$'; then
        echo "RELEASE_VERSION must be in format v1.2.3 for stable releases and in the format v1.2.3-rc.0 or v1.2.3-beta.1 for pre-releases." >&2
        exit 1
      fi

      if echo "$RELEASE_VERSION" | grep -Eq '^v0\.0\.'; then
        echo "RELEASE_VERSION cannot be a placeholder version (v0.0.x). This usually means no valid version was provided." >&2
        exit 1
      fi

      if [[ -z "${DRY_RUN:-}" && "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        if [[ "${CI_PIPELINE_SOURCE:-}" != "parent_pipeline" ]]; then
          echo "Stable releases must run in the child pipeline started by stable-collector-release." >&2
          exit 1
        fi

        # The GitLab mirror may not have fetched a tag published by a previous release.
        source .gitlab/collector-docker-common.sh
        published_ref="$(collector_release_refs "refs/tags/${RELEASE_VERSION}")"
        if [[ -n "$published_ref" ]]; then
          echo "$RELEASE_VERSION is already tagged on GitHub. Run recover-stable-release in the original child, or start a pipeline on main with RECOVER_RELEASE=true." >&2
          exit 1
        fi
      fi

      BASE_VERSION=$(echo "$RELEASE_VERSION" | sed -E 's/^v//; s/-(beta|rc)\.[0-9]+$//')

      LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n 1)
      if [ -n "$LATEST_TAG" ]; then
        LATEST_VERSION="${LATEST_TAG#v}"
        echo "Current latest release tag: $LATEST_TAG"

        if [ "$BASE_VERSION" = "$LATEST_VERSION" ] && echo "$RELEASE_VERSION" | grep -Eq '\-(beta|rc)\.[0-9]+$'; then
          echo "Pre-release $RELEASE_VERSION has the same base version as the current latest stable release $LATEST_TAG." >&2
          echo "Pre-releases should only be created for future versions, not for already-released versions." >&2
          exit 1
        fi

        # OLDER_VERSION is the smaller version between the latest tag and the release version
        OLDER_VERSION=$(printf '%s\n%s\n' "$LATEST_VERSION" "$BASE_VERSION" | sort -V | head -n 1)
        if [ "$OLDER_VERSION" != "$LATEST_VERSION" ]; then
          echo "RELEASE_VERSION $RELEASE_VERSION (${BASE_VERSION}) is older than the current latest release $LATEST_TAG (${LATEST_VERSION})." >&2
          echo "The release version must be greater than or equal to the current latest." >&2
          exit 1
        fi
        echo "Version check passed: $RELEASE_VERSION >= $LATEST_TAG"
      else
        echo "WARNING: No existing release tags found. Skipping version comparison."
      fi

      if echo "$RELEASE_VERSION" | grep -Eq '\-(beta|rc)\.[0-9]+$'; then
        echo "Pre-release version detected ($RELEASE_VERSION). Skipping changelog validation."
      else
        if ! grep -q "^## $RELEASE_VERSION" CHANGELOG.md; then
          echo "Version $RELEASE_VERSION not found in CHANGELOG.md" >&2
          exit 1
        fi
      fi

      # versions.yaml drives the module set tags created at release time; assert
      # it was bumped to this release so the tags match.
      SET_VERSION=$(awk '/^  splunk-otel-collector:/{f=1} f&&/^    version:/{print $2; exit}' versions.yaml)
      if [ "$SET_VERSION" != "$RELEASE_VERSION" ]; then
        echo "versions.yaml has the splunk-otel-collector module set at $SET_VERSION but release is $RELEASE_VERSION." >&2
        echo "Bump the version value in versions.yaml to $RELEASE_VERSION before releasing." >&2
        exit 1
      fi

      if [[ -z "${DRY_RUN:-}" && "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        mkdir -p dist/release-inputs
        attempt=$(jq -cn --arg project "$CI_PROJECT_ID" --arg pipeline "$CI_PIPELINE_ID" --arg version "$RELEASE_VERSION" \
          --arg quay "$QUAY_COLLECTOR_REPO" --arg hub "$DOCKER_HUB_COLLECTOR_REPO" \
          '{project:$project, pipeline:$pipeline, version:$version, quay:$quay, hub:$hub}')
        printf '%s\n' "$attempt" > dist/release-inputs/attempt.json
        printf 'Collector-Release-Attempt: %s\n' "$attempt"
      fi
      echo "Manual release triggered for version $RELEASE_VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: on_success
  allow_failure: false
  needs: []
  artifacts:
    expire_in: never
    paths:
      - dist/release-inputs/attempt.json

fossa:
  extends: .oss-scan
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  needs: []
  variables:
    jira_automation: "true"
  # allow_failure: false

sast-scan:
  stage: test
  extends: .sast_scan
  needs: []
  variables:
    alert_mode: "policy"
  allow_failure: false

.docker-reader-role: &docker-reader-role |
  creds-helper init
  eval $(creds-helper docker --eval "artifactory:v2/cloud/role/docker-reader-role")

.docker-releaser-role: &docker-releaser-role |
  creds-helper init
  eval $(creds-helper docker --eval "artifactory:v2/cloud/role/docker-releaser-role")

.docker-test-releaser-role: &docker-test-releaser-role |
  creds-helper init
  eval $(creds-helper docker --eval "artifactory:v2/cloud/role/docker-test-releaser-role")

.generic-releaser-role: &generic-releaser-role |
  creds-helper init
  eval $(creds-helper artifactory --eval "artifactory:v2/cloud/role/generic-releaser-role")

.generic-test-releaser-role: &generic-test-releaser-role |
  creds-helper init
  eval $(creds-helper artifactory --eval "artifactory:v2/cloud/role/generic-test-releaser-role")

.docker-publish-rules:
  rules:
    - if: '$DRY_RUN == "true" && $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "main" || ($CI_COMMIT_BRANCH && $RELEASE_VERSION == ""))'
    - if: '$DRY_RUN'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'

.collector-docker-functions: &collector-docker-functions |
  source .gitlab/collector-docker-common.sh

.set-docker-tags: &set-docker-tags |
  VERSION_TAG=""
  if [[ -z "${DRY_RUN:-}" ]]; then
    VERSION_TAG="${RELEASE_VERSION:-${CI_COMMIT_TAG:-}}"
  fi
  IMAGE_TAG="${VERSION_TAG#v}"
  LATEST_TAG=""
  if [[ -z "$VERSION_TAG" ]]; then
    IMAGE_TAG="$CI_COMMIT_SHA"
  fi
  if [[ -n "${DRY_RUN:-}" ]]; then
    IMAGE_TAG="${CI_COMMIT_SHA}-dryrun-${CI_PIPELINE_ID}"
  elif [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
    IMAGE_TAG="${IMAGE_TAG}-staging-${CI_PIPELINE_ID:?}"
    LATEST_TAG="latest"
  elif [[ -z "$VERSION_TAG" && "${CI_COMMIT_BRANCH:-}" == main ]]; then
    LATEST_TAG="latest"
  fi

.sign-docker:
  extends: .docker-publish-rules
  retry: 2
  id_tokens:  # http://go/gitlab-17
    CI_JOB_JWT:
      aud:
        - $CICD_VAULT_ADDR
        - $SIGNING_PRD_URL
  script:
    - *collector-docker-functions
    - login_to_quay
    - echo "listing images to be signed"
    - cat tags_to_sign
    - |
      while read -r tag digest; do
        artifact-ci sign docker "${tag%:*}@${digest}"
      done < tags_to_sign

.get-artifactory-stage: &get-artifactory-stage
  - |
    set -ex
    export STAGE="test"
    if [[ "${CI_COMMIT_TAG:-}" =~ (beta|rc) ]] || [[ "${RELEASE_VERSION:-}" =~ (beta|rc) ]]; then
      export STAGE="beta"
    elif [[ "${CI_COMMIT_TAG:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "${RELEASE_VERSION:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
      export STAGE="release"
    fi

.aws-releaser-role: &aws-releaser-role |
  creds-helper init
  eval $(creds-helper aws --eval "aws:v1/o11y-infra/role/o11y_gdi_otel_releaser_role")

.trigger-filter:
  rules:
    - &main-condition
      if: $CI_COMMIT_BRANCH == "main"
    # commenting out the original commit-tag trigger condition for collector release
    # - &release-condition
    #   if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+.*/
    - &manual-release-condition
      if: $RELEASE_VERSION =~ /^v[0-9]+\.[0-9]+\.[0-9]+.*/ && $CI_COMMIT_BRANCH == "main"
    - &no-schedules-condition
      if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - &dry-run-condition
      if: $DRY_RUN == "true" && $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH != "main" && $RELEASE_VERSION == ""
      when: always

.deploy-release:
  image: '${DOCKER_CICD_REPO}/ci-container/python-3.12-bookworm:3.5.0'
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - packaging/release/requirements.txt
    paths:
      - .cache/pip
  retry: 2
  id_tokens:  # http://go/gitlab-17
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  script:
    - *get-artifactory-stage
    - *aws-releaser-role
    - pip3 install -r packaging/release/requirements.txt
    - |
      if [[ -n "${DRY_RUN:-}" ]]; then
        echo "DRY_RUN: skipping S3/Artifactory publish"
      else
        if [ -n "${PATHS:-}" ]; then
          for path in $PATHS; do
            if [ ! -f "$path" ]; then
              echo "$path not found!"
              exit 1
            fi
            python3 packaging/release/release.py --force --stage=${STAGE} --path=$path ${OPTIONS:-}
          done
        elif [ -n "${INSTALLERS:-}" ]; then
          python3 packaging/release/release.py --force --installers ${OPTIONS:-}
        else
          echo "Either the PATHS or INSTALLERS env var must be defined!" >&2
          exit 1
        fi
      fi

.go-cache:
  image: '${DOCKER_HUB_REPO}/golang:${GO_VERSION}'
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  before_script:
    - mkdir -p $GOPATH
    - make install-tools
    - export PATH=$GOPATH/bin:$PATH
  cache:
    key:
      files:
        - go.mod
        - go.sum
    paths:
      - .go/pkg/mod
      - .go/bin

# Upload deb/rpm package for the main branch to the generic-test artifactory repo for xray scanning
.xray-publish-package: &xray-publish-package
  - if [[ ! "${PKG_TYPE:-}" =~ ^deb|rpm$ ]]; then exit 0; fi
  - if [ "$CI_COMMIT_BRANCH" != "main" ]; then touch xray_artifact_path; exit 0; fi
  - *generic-test-releaser-role
  - package=$(find ./dist -name "*.${PKG_TYPE}")
  - if [[ -z "$package" || ! -f "$package" ]]; then echo "Failed to find $PKG_TYPE package"; exit 1; fi
  - target="splunk-otel-collector/${CI_COMMIT_SHA}/$(basename $package)"
  - artifact-ci publish generic -o $package generic-test/${target}
  - |
    # Xray needs the local repo path to the artifact.
    # Determine the local repo after uploading to the virtual repo.
    local_repo=""
    for repo in "generic-test-east-local" "generic-test-west-local"; do
      if curl -LIf -u $ARTIFACTORY_AUTHORIZATION ${ARTIFACTORY_BASE_URL}/${repo}/${target}; then
        local_repo=$repo
        break
      fi
    done
    if [ -z "$local_repo" ]; then
      echo "Failed to determine local repo for $target"
      exit 1
    fi
  - echo "${ARTIFACTORY_BASE_URL}/${local_repo}/${target}" | tee xray_artifact_path

.xray-scan-package:
  rules:
    - <<: *no-schedules-condition
    - <<: *main-condition
  extends: .binary-scan
  variables:
    create_jira: "true"
  before_script:
    - export ARTIFACT_PATH=$(cat xray_artifact_path)
    - echo $ARTIFACT_PATH

update-otel-deps:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  extends: .go-cache
  tags: [large]
  needs: []
  script:
    - .gitlab/install-gh-cli.sh
    - .gitlab/update-otel-deps.sh latest create-pull-request/update-deps

update-otel-deps-nightly:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  extends: .go-cache
  tags: [large]
  needs: []
  script:
    - .gitlab/install-gh-cli.sh
    - .gitlab/update-otel-deps.sh main create-pull-request/update-deps-nightly

update-javaagent:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  extends: .go-cache
  tags: [large]
  needs: []
  script:
    - .gitlab/install-yq.sh
    - .gitlab/install-gh-cli.sh
    - .gitlab/update-javaagent.sh

update-nodejs-agent:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  extends: .go-cache
  tags: [large]
  needs: []
  script:
    - .gitlab/install-yq.sh
    - .gitlab/install-gh-cli.sh
    - .gitlab/update-nodejs-agent.sh

update-dotnet-agent:
  rules:
