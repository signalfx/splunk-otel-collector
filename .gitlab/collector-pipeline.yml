# Verify Artifactory-generated repo metadata signatures after package publish.
verify-signed-metadata:
  extends: .trigger-filter
  rules:
    - *main-condition
    - *manual-release-condition
    - *no-schedules-condition
    - *dry-run-condition
  needs:
    - job: release-debs
      artifacts: false
      optional: true
    - job: release-rpms
      artifacts: false
      optional: true
  retry: 2
  parallel:
    matrix:
      - TARGET: deb
      - TARGET: rpm
        ARCH: x86_64
      - TARGET: rpm
        ARCH: aarch64
  variables:
    SPLUNK_RPM_GPG_KEY_URL: "https://splunk.jfrog.io/splunk/otel-collector-rpm/splunk-B3CD4420.pub"
    SPLUNK_DEB_GPG_KEY_URL: "https://splunk.jfrog.io/splunk/otel-collector-deb/splunk-B3CD4420.gpg"
    SPLUNK_GPG_FINGERPRINT: "58C33310B7A354C1279DB6695EFA01EDB3CD4420"
  before_script:
    - apt update && apt install -y curl gnupg
  script:
    - *get-artifactory-stage
    - |
      set -exo pipefail

      export GNUPGHOME="$(mktemp -d)"
      trap 'rm -rf "$GNUPGHOME"' EXIT
      gpg --import <(curl -fsSL "${SPLUNK_RPM_GPG_KEY_URL}")
      gpg --import <(curl -fsSL "${SPLUNK_DEB_GPG_KEY_URL}")

      gpg --list-keys "${SPLUNK_GPG_FINGERPRINT}" >/dev/null \
        || { echo "Expected signing key ${SPLUNK_GPG_FINGERPRINT} not found at the published key URL(s)!"; exit 1; }

      case "$TARGET" in
        deb)
          base="https://splunk.jfrog.io/artifactory/otel-collector-deb/dists/${STAGE}"
          curl -fsSL "${base}/Release" -o metadata.deb-Release
          curl -fsSL "${base}/Release.gpg" -o metadata.deb-Release.gpg
          curl -fsSL "${base}/InRelease" -o metadata.deb-InRelease

          gpg --status-fd=1 --verify metadata.deb-Release.gpg metadata.deb-Release \
            | grep -Eq "^\[GNUPG:\] VALIDSIG ${SPLUNK_GPG_FINGERPRINT}( |\$)" \
            || { echo "DEB Release.gpg did not validate against pinned key ${SPLUNK_GPG_FINGERPRINT}!"; exit 1; }

          gpg --status-fd=1 --verify metadata.deb-InRelease \
            | grep -Eq "^\[GNUPG:\] VALIDSIG ${SPLUNK_GPG_FINGERPRINT}( |\$)" \
            || { echo "DEB InRelease did not validate against pinned key ${SPLUNK_GPG_FINGERPRINT}!"; exit 1; }
          ;;
        rpm)
          base="https://splunk.jfrog.io/artifactory/otel-collector-rpm/${STAGE}/${ARCH}/repodata"
          curl -fsSL "${base}/repomd.xml" -o "metadata.rpm-${ARCH}-repomd.xml"
          curl -fsSL "${base}/repomd.xml.asc" -o "metadata.rpm-${ARCH}-repomd.xml.asc"

          gpg --status-fd=1 --verify "metadata.rpm-${ARCH}-repomd.xml.asc" "metadata.rpm-${ARCH}-repomd.xml" \
            | grep -Eq "^\[GNUPG:\] VALIDSIG ${SPLUNK_GPG_FINGERPRINT}( |\$)" \
            || { echo "RPM ${ARCH} repomd.xml.asc did not validate against pinned key ${SPLUNK_GPG_FINGERPRINT}!"; exit 1; }
          ;;
        *)
          echo "Unknown TARGET '${TARGET}'"; exit 1
          ;;
      esac

      echo "Metadata signature OK for ${TARGET}${ARCH:+-${ARCH}}"

.verify-rpm-repository-install:
  image: '${DOCKER_HUB_REPO}/rockylinux:9'
  rules:
    - *no-schedules-condition
    - if: $CI_COMMIT_BRANCH == "main" && $RELEASE_VERSION == ""
    - if: $CI_COMMIT_BRANCH == "main" && $RELEASE_VERSION =~ /^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)\.[0-9]+$/
    - *dry-run-condition
  needs:
    - job: release-rpms
      artifacts: false
  retry: 2
  parallel:
    matrix:
      - ARCH: x86_64
        RUNNER_TAG: main
      - ARCH: aarch64
        RUNNER_TAG: arm
  tags:
    - $RUNNER_TAG
  before_script:
    - *get-artifactory-stage
  script:
    - RPM_REPO_GPGCHECK=1 RPM_REPO_STAGE="$STAGE" ./packaging/tests/verify-rpm-repository-install.sh "$RPM_TEST_CASE" "$ARCH"

verify-rpm-candidate-install:
  extends: .verify-rpm-repository-install
  variables:
    RPM_TEST_CASE: candidate

verify-rpm-previous-install:
  extends: .verify-rpm-repository-install
  variables:
    RPM_TEST_CASE: previous

# only upload the msi to S3 for stable release tags
release-msi:
  rules:
    - <<: *manual-release-condition
  extends:
    - .deploy-release
  needs:
    - job: sign-msi
      artifacts: true
  variables:
    PATHS: dist/signed/*.msi

# only upload the installer scripts to S3 for stable release tags
release-installers:
  rules:
    - <<: *manual-release-condition
  extends:
    - .deploy-release
  needs:
    - job: sign-ps-installer
      artifacts: true
  variables:
    INSTALLERS: "true"
  before_script:
    - cp -f dist/signed/install.ps1 packaging/installer/install.ps1

build-nupkg:
  extends: .trigger-filter
  image: mcr.microsoft.com/windows/servercore:ltsc2022
  needs:
    - job: sign-msi
      artifacts: true
  tags:
    - windows2022
  script:
    - . .gitlab/windows/runner-setup-helpers.ps1
    - Install-Chocolatey
    - |
      $ErrorActionPreference = 'Stop'
      Set-PSDebug -Trace 1
      $msi_file_name = Resolve-Path .\dist\signed\splunk-otel-collector*-amd64.msi | Split-Path -leaf
      if ($msi_file_name -match '(\d+\.\d+\.\d+)(\.\d+)?') {
        $version = $matches[0]
      } else {
        throw "Failed to get version from $msi_file_name"
      }
      .\packaging\choco\make.ps1 build_choco -Version $version -BuildDir .\dist\signed
    - Test-Path .\dist\signed\splunk-otel-collector.${version}.nupkg
  artifacts:
    paths:
      - .\dist\signed\*.nupkg
      - .\dist\signed\*amd64.msi

choco-release:
  extends: .trigger-filter
  image: mcr.microsoft.com/windows/servercore:ltsc2022
  needs:
    - job: manual_release_trigger
      optional: true
    - job: build-nupkg
      artifacts: true
    - job: github-release
      artifacts: false
  tags:
    - windows2022
  script:
    - . .gitlab/windows/runner-setup-helpers.ps1
    - Install-Chocolatey
    - |
      $ErrorActionPreference = 'Stop'
      Set-PSDebug -Trace 1
      if (-not (Test-Path .\dist\signed\splunk-otel-collector*-amd64.msi)) {
        throw "MSI artifact not found in dist/signed/"
      }
      $msi_file_name = Resolve-Path .\dist\signed\splunk-otel-collector*-amd64.msi | Split-Path -leaf
      if ($msi_file_name -match '(\d+\.\d+\.\d+(\.\d+)?)') {
        $version = $matches[0]
      } else {
        throw "Failed to get version from $msi_file_name"
      }
    - Test-Path .\dist\signed\splunk-otel-collector.${version}.nupkg
    - |
      # Only push the choco package for stable release tags or manual releases
      $should_release = $false
      if ($env:RELEASE_VERSION -match '^v\d+\.\d+\.\d+$') {
        $should_release = $true
      } elseif ($env:CI_COMMIT_TAG -match '^v\d+\.\d+\.\d+$') {
        $should_release = $true
      }
      if ($should_release -and -not $env:DRY_RUN) {
        choco config set --name="'defaultPushSource'" --value="'https://push.chocolatey.org/'"
        choco push -k $env:CHOCO_TOKEN .\dist\signed\splunk-otel-collector.${version}.nupkg
      } else {
        Write-Host "Skipping choco push - not a stable release tag, manual release, or DRY_RUN is set"
      }

ta-v2-splunkbase-release:
  extends: .trigger-filter
  needs:
    - job: manual_release_trigger
      optional: true
    - job: pack-ta-v2
      artifacts: true
    - job: github-release
      artifacts: false
  script:
    - |
      # Only push the TA v2 to Splunkbase for stable release tags or manual releases
      should_release=false
      if [[ "${RELEASE_VERSION:-}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        should_release=true
      fi
      if [[ "$should_release" = true ]] && [[ -z "$DRY_RUN" ]]; then
        echo "Releasing TA v2 to Splunkbase"
        TA_DIR=packaging/ta-v2/out/distribution

        declare -A log_files pids
        for entry in \
            "7125:${TA_DIR}/Splunk_TA_otel.tgz" \
            "8698:${TA_DIR}/Splunk_TA_otel_linux_x86_64.tgz" \
            "8699:${TA_DIR}/Splunk_TA_otel_windows_x86_64.tgz"
        do
          app_id="${entry%%:*}"
          package="${entry#*:}"
          log=$(mktemp)
          echo "Publishing ${package} to Splunkbase with app ID ${app_id}. Logs at ${log}"
          log_files[$app_id]="$log"
          APP_ID="$app_id" TA_PACKAGE="$package" VERSION_TAG="${RELEASE_VERSION}" APP_NAME="Add-On with Splunk OpenTelemetry Collector" \
            ./.gitlab/publish-ta-v2-to-splunkbase.sh >"$log" 2>&1 &
          pid=$!
          echo "Started publication process with PID $pid for app ID $app_id"
          pids[$app_id]=$pid
        done

        overall_status=0
        for app_id in "${!pids[@]}"; do
          wait "${pids[$app_id]}" && publish_status=0 || publish_status=$?
          if [[ "$publish_status" -ne 0 ]]; then
            overall_status=1
          fi
          echo "Publication process for app ID $app_id completed with status ${publish_status}"
          echo "*+*+*+*+* Logs for app ID $app_id *+*+*+*+*"
          cat "${log_files[$app_id]}"
          echo "End of logs for app ID $app_id"
          rm -f "${log_files[$app_id]}"
        done
        exit "$overall_status"
      else
        echo "Skipping TA v2 release - not a stable release tag, manual release, or DRY_RUN is set"
      fi

