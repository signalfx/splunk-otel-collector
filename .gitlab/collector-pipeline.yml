push-multiarch-manifest:
  extends: .docker-publish-rules
  parallel:
    matrix: &collector-manifest-matrix
      - MANIFEST: [multiarch, windows_multiarch]
        FIPS: ["-fips", ""]
  needs:
    - build-push-linux-image
    - build-push-linux-fips-image
    - build-push-windows-image
    - build-push-windows-fips-image
  retry: 2
  id_tokens:  # http://go/gitlab-17
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  script:
    - *collector-docker-functions
    - login_to_quay
    - *set-docker-tags
    - bash .gitlab/publish-collector-docker-manifest.sh "$MANIFEST" "$FIPS" "$VERSION_TAG" "$IMAGE_TAG"
    - if [[ -n "${DRY_RUN:-}" || "$CI_COMMIT_BRANCH" != "main" || "$MANIFEST" != "multiarch" ]]; then exit 0; fi
    # Copy the Quay manifest to Artifactory for Xray. Use the same digest the mirror will copy.
    - *docker-test-releaser-role
    - |
      read -r image digest < "dist/docker/${QUAY_COLLECTOR_REPO}/tags_to_sign_${MANIFEST}${FIPS}"
      target="${DOCKER_TEST_XRAY_REPO}/splunk-otel-collector/${image##*/}"
      copy_collector_image "${image%:*}" "$digest" "$target"
      docker buildx imagetools inspect "$target"
  artifacts:
    paths:
      - dist/docker/${QUAY_COLLECTOR_REPO}/${MANIFEST}${FIPS}_digest.txt
      - dist/docker/${QUAY_COLLECTOR_REPO}/tags_to_sign_${MANIFEST}${FIPS}
      - dist/docker/${QUAY_COLLECTOR_REPO}/images_${MANIFEST}${FIPS}.txt

sign-multiarch-manifest:
  extends: .sign-docker
  parallel:
    matrix: *collector-manifest-matrix
  needs:
    - push-multiarch-manifest
  before_script:
    - cp "dist/docker/${QUAY_COLLECTOR_REPO}/images_${MANIFEST}${FIPS}.txt" tags_to_sign
  artifacts:
    paths:
      - dist/docker/${QUAY_COLLECTOR_REPO}/images_${MANIFEST}${FIPS}.txt
      - dist/docker/${QUAY_COLLECTOR_REPO}/tags_to_sign_${MANIFEST}${FIPS}
      - dist/docker/${QUAY_COLLECTOR_REPO}/${MANIFEST}${FIPS}_digest.txt

mirror-docker-images:
  extends: .sign-docker
  parallel:
    matrix: *collector-manifest-matrix
  needs:
    - sign-multiarch-manifest
  script:
    - *collector-docker-functions
    - login_to_quay
    - bash .gitlab/mirror-collector-docker-images.sh "${MANIFEST}${FIPS}"
  artifacts:
    paths:
      - dist/docker/${DOCKER_HUB_COLLECTOR_REPO}/${MANIFEST}${FIPS}_digest.txt
      - dist/docker/${DOCKER_HUB_COLLECTOR_REPO}/images_${MANIFEST}${FIPS}.txt

xray-scan-docker:
  rules:
    - if: '$DRY_RUN'
      when: never
    - <<: *no-schedules-condition
    - <<: *main-condition
  extends: .container-scan
  parallel:
    matrix:
      # - CHILD: ["amd64", "arm64", "ppc64le", "2019", "2022"]
      - CHILD: ["amd64"]  # the .container-scan template currently only supports linux/amd64 images
  needs:
    - sign-multiarch-manifest
  variables:
    create_jira: "true"
  before_script:
    - |
      records="dist/docker/${QUAY_COLLECTOR_REPO}/images_multiarch.txt"
      record="$(awk -v suffix="-${CHILD}$" '$1 ~ suffix { print $1, $2 }' "$records")"
      read -r image digest <<< "$record"
      if [[ -z "$image" || ! "$digest" =~ ^sha256:[a-f0-9]{64}$ || "$record" == *$'\n'* ]]; then
        echo "Expected one signed Docker digest for linux/${CHILD}" >&2
        exit 1
      fi
      export CONTAINER_IMAGE="${image%:*}@${digest}"
      echo "$CONTAINER_IMAGE"

.github-release-tools:
  extends: .go-cache
  tags: [large]
  needs:
    - job: manual_release_trigger
      artifacts: false
  before_script: []
  script:
    - cd internal/tools
    - CGO_ENABLED=0 GOBIN="$CI_PROJECT_DIR/dist/github-release-tools" go install github.com/tcnksm/ghr go.opentelemetry.io/build-tools/multimod
  artifacts:
    paths:
      - dist/github-release-tools/

build-github-release-tools:
  extends: .github-release-tools
  rules:
    - if: '$DRY_RUN'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $RELEASE_VERSION =~ /^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)\.[0-9]+$/'

build-stable-github-release-tools:
  extends: .github-release-tools
  rules:
    - if: &stable-release-job '$CI_COMMIT_BRANCH == "main" && $RELEASE_VERSION =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && ($DRY_RUN == null || $DRY_RUN == "")'
  script:
    - !reference [.github-release-tools, script]
    - mkdir -p "$CI_PROJECT_DIR/dist/release-inputs"
    - printf '%s\n' "$CI_JOB_ID" > "$CI_PROJECT_DIR/dist/release-inputs/tools"
  artifacts:
    name: "collector-${RELEASE_VERSION}-${CI_PIPELINE_ID}-release-tools"
    expire_in: never
    paths:
      - dist/github-release-tools/
      - dist/release-inputs/tools

.github-release-inputs:
  needs: &github-release-inputs
    - job: compile
      artifacts: true
    - job: otelcol-fips
      artifacts: true
    - job: libotelinject
      artifacts: true
    - job: sign-exe
      artifacts: true
    - job: sign-osx
      artifacts: true
    - job: sign-debs
      artifacts: true
    - job: build-nupkg
      artifacts: true
    - job: sign-rpms
      artifacts: true
    - job: verify-signed-metadata
      artifacts: false
      optional: true
    - job: sign-msi
      artifacts: true
    - job: sign-tar
      artifacts: true
    - job: sign-multiarch-manifest
      artifacts: true
      optional: true
    - job: mirror-docker-images
      artifacts: true
      optional: true
    - job: release-msi
      artifacts: false
      optional: true
    - job: release-installers
      artifacts: false
      optional: true
    - job: pack-ta-v2
      artifacts: true
    - job: pack-otlpinput
      artifacts: true
    - job: build-github-release-tools
      artifacts: true
      optional: true

prepare-stable-github-release:
  tags: [large]
  rules:
    - if: *stable-release-job
  needs: *github-release-inputs
  script:
    - bash .gitlab/prepare-github-release-assets.sh
    - mkdir -p dist/release-inputs
    - printf '%s\n' "$CI_JOB_ID" > dist/release-inputs/assets
  artifacts:
    name: "collector-${RELEASE_VERSION}-${CI_PIPELINE_ID}-release"
    expire_in: never
    paths:
      - dist/assets/
      - dist/release-inputs/assets

retain-stable-docker-records:
  rules:
    - if: *stable-release-job
  needs:
    - sign-multiarch-manifest
    - mirror-docker-images
  script:
    - test -s "dist/docker/${QUAY_COLLECTOR_REPO}/multiarch_digest.txt"
    - test -s "dist/docker/${DOCKER_HUB_COLLECTOR_REPO}/multiarch_digest.txt"
    - mkdir -p dist/release-inputs
    - printf '%s\n' "$CI_JOB_ID" > dist/release-inputs/docker
  artifacts:
    name: "collector-${RELEASE_VERSION}-${CI_PIPELINE_ID}-docker-records"
    expire_in: never
    paths:
      - dist/docker/
      - dist/release-inputs/docker

github-release:
  tags: [large]
  resource_group: collector-docker-latest
  rules:
    - if: *stable-release-job
      needs:
        - prepare-stable-github-release
        - retain-stable-docker-records
        - build-stable-github-release-tools
    - !reference [.trigger-filter, rules]
  needs: *github-release-inputs
  script:
    - *set-docker-tags
    - |
      set -e
      if [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        bash .gitlab/publish-stable-collector-release.sh "$VERSION_TAG" "$IMAGE_TAG"
      else
        bash .gitlab/prepare-github-release-assets.sh
        if [[ -n "${DRY_RUN:-}" ]]; then
          echo "DRY_RUN: skipping GitHub tag creation and release"
        elif [[ -n "${RELEASE_VERSION:-}" && -z "${CI_COMMIT_TAG:-}" ]]; then
          tools_dir="$CI_PROJECT_DIR/dist/github-release-tools"
          test -x "$tools_dir/multimod"
          export PATH="$tools_dir:$PATH"
          ./.gitlab/create-github-tag.sh "$VERSION_TAG" "$CI_COMMIT_SHA"
        fi
      fi

  artifacts:
    when: always
    paths:
      - dist/assets

.promote-docker-latest:
  resource_group: collector-docker-latest

promote-docker-latest:
  extends: .promote-docker-latest
  rules:
    - if: '$DRY_RUN'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $RELEASE_VERSION == ""'
  needs:
    - mirror-docker-images
  script:
    - *set-docker-tags
    - bash .gitlab/promote-collector-docker-images.sh "$IMAGE_TAG" "$LATEST_TAG"

promote-docker-stable-latest:
  extends: .promote-docker-latest
  retry: 2
  rules:
    - if: *stable-release-job
  needs:
    - retain-stable-docker-records
    - job: github-release
      artifacts: false
  script:
    - *set-docker-tags
    - bash .gitlab/promote-stable-collector-latest.sh "$VERSION_TAG" "$IMAGE_TAG"

recover-stable-release:
  tags: [large]
  resource_group: collector-docker-latest
  rules:
    - if: *stable-release-job
      when: manual
      allow_failure: true
  # Start without downloading artifacts from the latest attempts of build jobs.
  needs: []
  script:
    - *set-docker-tags
    - bash .gitlab/publish-stable-collector-release.sh "$VERSION_TAG" "$IMAGE_TAG" --recover-only
    - bash .gitlab/promote-stable-collector-latest.sh "$VERSION_TAG" "$IMAGE_TAG"

.ansible:
  image: 'cimg/python:3.13'
  rules:
    - if: $CI_COMMIT_TAG =~ /^ansible-v[0-9]+\.[0-9]+\.[0-9]+.*/
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "ansible-pip-cache"
    paths:
      - .cache/pip

ansible-build:
  extends: .ansible
  needs: []
  artifacts:
    paths:
      - dist/
  before_script:
    - pip3 install 'ansible>=12.2.0'
  script:
    - ansible-galaxy collection build ./deployments/ansible_collections/signalfx/splunk_otel_collector --output-path ./dist

ansible-release:
  extends: .ansible
  needs:
    - job: ansible-build
      artifacts: true
  before_script:
    - pip3 install 'ansible>=12.2.0' yq~=3.0.0
  script:
    - |
      COLLECTION_VERSION=$(cat ./deployments/ansible_collections/signalfx/splunk_otel_collector/galaxy.yml | yq .version -r)
      if [ -z "$COLLECTION_VERSION" ]; then
        echo "ERROR: Failed to extract version from galaxy.yml" >&2
        exit 1
      fi
      echo "Publishing collection version: $COLLECTION_VERSION"
    - ansible-galaxy collection publish ./dist/signalfx-splunk_otel_collector-${COLLECTION_VERSION}.tar.gz --token=${ANSIBLE_GALAXY_TOKEN}

puppet-release:
  image: '${DOCKER_HUB_REPO}/ruby:2.6-buster'
  rules:
    - if: $CI_COMMIT_TAG =~ /^puppet-v[0-9]+\.[0-9]+\.[0-9]+.*/
  needs: []
  before_script:
    - gem update --system 3.2.3
    - gem install bundler -v 2.4.22
    - cd deployments/puppet
    - bundle install
    - bundle exec rake module:clean
  script:
    - |
      export BLACKSMITH_FORGE_URL=https://splunk.jfrog.io/artifactory/puppet-splunk
      export BLACKSMITH_FORGE_TYPE=artifactory
      export BLACKSMITH_FORGE_USERNAME="${ARTIFACTORY_USERNAME}"
      export BLACKSMITH_FORGE_PASSWORD="${ARTIFACTORY_TOKEN}"
      bundle exec rake module:push
  artifacts:
    paths:
      - deployments/puppet/pkg/*.tar.gz

chef-release:
  image: 'chef/chefworkstation:stable'
  rules:
    - if: $CI_COMMIT_TAG =~ /^chef-v[0-9]+\.[0-9]+\.[0-9]+.*/
  needs: []
  before_script:
    - mkdir -p ~/.chef
    - cat "$CHEF_PEM" > ~/.chef/signalfx.pem
    - cat "$CHEF_KNIFE_RB" > ~/.chef/knife.rb
    - mkdir -p /tmp/cookbooks
    - cp -r deployments/chef /tmp/cookbooks/splunk_otel_collector
  script:
    - knife supermarket share -o /tmp/cookbooks splunk_otel_collector
