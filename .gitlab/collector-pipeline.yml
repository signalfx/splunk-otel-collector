build-msi:
  extends: .trigger-filter
  image: mcr.microsoft.com/dotnet/sdk:10.0.101-windowsservercore-ltsc2022
  needs:
    - sign-exe
    - msi-custom-actions-package
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  before_script:
    # Build the MSI with the signed executables
    - New-Item -Path bin -ItemType Directory -Force
    - Copy-Item -Force dist/signed/otelcol_windows_$($env:ARCH).exe bin/otelcol_windows_$($env:ARCH).exe
    - Copy-Item -Force dist/signed-msi-inputs/otelcollauncher_windows_$($env:ARCH).exe bin/otelcollauncher_windows_$($env:ARCH).exe
    - Copy-Item -Force dist/signed-msi-inputs/opampsupervisor_windows_$($env:ARCH).exe bin/opampsupervisor_windows_$($env:ARCH).exe
  tags:
    - windows2022
  script:
    - . .gitlab/windows/runner-setup-helpers.ps1
    - Install-Chocolatey
    - Install-Git
    - |
      # Install WiX toolset
      & dotnet tool restore
      & dotnet wix eula accept wix7
    - |
      # Equivalent of: VERSION_TAG="${RELEASE_VERSION:-${CI_COMMIT_TAG:-}}"
      if (-not [string]::IsNullOrEmpty($env:RELEASE_VERSION)) {
          $VERSION_TAG = $env:RELEASE_VERSION
      } elseif (-not [string]::IsNullOrEmpty($env:CI_COMMIT_TAG)) {
          $VERSION_TAG = $env:CI_COMMIT_TAG
      } else {
          $VERSION_TAG = ""
      }
    - |
      $bashCmd = "./packaging/msi/build.sh --version '$VERSION_TAG' --arch $($env:ARCH)"
      & 'C:\Program Files\Git\bin\bash.exe' -c "$bashCmd"
  artifacts:
    paths:
      - dist/*.msi

