  extends:
    - .trigger-filter
    - .submit-signing-request
  retry: 2
  needs: []
  variables:
    ARTIFACT: dist/install.ps1
    SIGN_TYPE: WIN
    DOWNLOAD_DIR: dist/signed
  before_script:
    - mkdir -p dist
    - cp packaging/installer/install.ps1 dist/install.ps1
  artifacts:
    paths:
