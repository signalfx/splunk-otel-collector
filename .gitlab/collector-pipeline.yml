      mkdir -p packaging/ta-v2/assets/linux_x86_64/bin
      cp bin/otelcol_linux_amd64 packaging/ta-v2/assets/linux_x86_64/bin/Splunk_TA_otel
      mkdir -p packaging/ta-v2/assets/windows_x86_64/bin
      cp dist/signed/otelcol_windows_amd64.exe packaging/ta-v2/assets/windows_x86_64/bin/Splunk_TA_otel.exe
    - |
      VERSION_TAG="${RELEASE_VERSION:-${CI_COMMIT_TAG:-}}"
      if [[ -n "${VERSION_TAG:-}" ]]; then
        export VERSION="${VERSION_TAG}"
      fi
      echo "VERSION is set to $VERSION"
