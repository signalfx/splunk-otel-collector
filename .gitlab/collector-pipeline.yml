release-debs:
  extends:
    - .trigger-filter
  image: '${DOCKER_CICD_REPO}/ci-container/python-3.12-bookworm:3.5.0'
  rules:
    - *main-condition
    - *manual-release-condition
    - *no-schedules-condition
    - *dry-run-condition
  resource_group: artifactory-deb
  needs:
    - job: sign-debs
      artifacts: true
  retry: 2
  timeout: 2h
  before_script:
    - *get-artifactory-stage
