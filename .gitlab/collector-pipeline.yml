    - .gitlab/update-injector.sh

check-mass-deployments-release:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  extends: .go-cache
  tags: [large]
  needs: []
  script:
    - .gitlab/install-gh-cli.sh
    - .gitlab/check-mass-deployments-release.sh

tidy-dependabot-pr:
  rules:
    - if: ($CI_COMMIT_BRANCH =~ /^dependabot\/go_modules\/.*/) && ($CI_COMMIT_AUTHOR =~ /^dependabot.*/) && (($CI_PIPELINE_SOURCE == "merge_request_event") || ($CI_PIPELINE_SOURCE == "push"))
  extends: .go-cache
  tags: [large]
  needs: []
  script:
    - .gitlab/install-gh-cli.sh
    - .gitlab/tidy-dependabot-pr.sh

compile:
  timeout: 2h
  extends:
    - .trigger-filter
    - .go-cache
  tags: [large]
  needs:
    - job: manual_release_trigger
      optional: true
  parallel:
    matrix:
      - TARGET: [binaries-aix_ppc64, binaries-darwin_amd64, binaries-darwin_arm64, binaries-linux_amd64, binaries-linux_arm64, binaries-windows_amd64, binaries-windows_arm64, binaries-linux_ppc64le]
  script:
    - |
      VERSION_TAG="${RELEASE_VERSION:-${CI_COMMIT_TAG:-}}"
      if [[ -n "${VERSION_TAG:-}" ]]; then
        make $TARGET VERSION=${VERSION_TAG}
      else
        make $TARGET
      fi
  after_script:
    - if [ -e bin/otelcol ]; then rm -f bin/otelcol; fi  # remove the symlink
  artifacts:
    paths:
      - bin/otelcol_*
      - bin/otelcollauncher_*
      - bin/opampsupervisor_*

otelcol-fips:
  extends:
    - .trigger-filter
    - .go-cache
  needs:
    - job: manual_release_trigger
      optional: true
  parallel:
    matrix:
      - GOOS: linux
        GOARCH: amd64
        TAG: main
      - GOOS: linux
        GOARCH: arm64
        TAG: arm
      - GOOS: windows
        GOARCH: amd64
        TAG: main
  tags:
    - $TAG
  script:
    - |
      VERSION_TAG="${RELEASE_VERSION:-${CI_COMMIT_TAG:-}}"
      if [[ -n "${VERSION_TAG:-}" ]]; then
        make otelcol-fips VERSION=${VERSION_TAG}
      else
        make otelcol-fips
      fi
  artifacts:
    paths:
      - bin/otelcol-fips_*

libotelinject:
  extends: .trigger-filter
  needs:
    - job: manual_release_trigger
      optional: true
  retry: 2
  parallel:
    matrix:
      - ARCH: amd64
        TAG: main
      - ARCH: arm64
        TAG: arm
  tags:
    - $TAG
  id_tokens:  # http://go/gitlab-17
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  script:
    - *docker-reader-role
    - make -C instrumentation dist ARCH=${ARCH} DOCKER_REPO=${DOCKER_HUB_REPO} INJECTOR_GIT_REPO=https://github.com/open-telemetry/opentelemetry-injector.git
  artifacts:
    paths:
      - instrumentation/dist/libotelinject_*.so

.instrumentation-deb-rpm:
  extends: .trigger-filter
  needs:
    - libotelinject
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  id_tokens:  # http://go/gitlab-17
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  before_script:
    - ./instrumentation/packaging/fpm/install-deps.sh
  script:
    - |
      VERSION_TAG="${RELEASE_VERSION:-${CI_COMMIT_TAG:-}}"
      ./instrumentation/packaging/fpm/${PKG_TYPE}/build.sh "${VERSION_TAG}" "$ARCH" "./dist"
    - *xray-publish-package

instrumentation-deb:
  extends: .instrumentation-deb-rpm
  variables:
    PKG_TYPE: deb
  artifacts:
    paths:
      - dist/*.deb
      - xray_artifact_path

xray-instrumentation-deb:
  extends: .xray-scan-package
  needs:
    - instrumentation-deb
  parallel:
    matrix:
      - ARCH: [amd64, arm64]

instrumentation-rpm:
  extends: .instrumentation-deb-rpm
  variables:
    PKG_TYPE: rpm
  artifacts:
    paths:
      - dist/*.rpm
      - xray_artifact_path

xray-instrumentation-rpm:
  extends: .xray-scan-package
  needs:
    - instrumentation-rpm
  parallel:
    matrix:
      - ARCH: [amd64, arm64]

sign-exe:
  extends:
    - .trigger-filter
    - .submit-signing-request
  retry: 2
  needs:
    - compile
    - otelcol-fips
  parallel:
    matrix:
      - TARGET: otelcol
        ARCH: [amd64, arm64]
        DOWNLOAD_DIR: dist/signed
      - TARGET: otelcol-fips
        ARCH: amd64
        DOWNLOAD_DIR: dist/signed
      - TARGET: [otelcollauncher, opampsupervisor]
        ARCH: [amd64, arm64]
        DOWNLOAD_DIR: dist/signed-msi-inputs
  variables:
    ARTIFACT: bin/${TARGET}_windows_${ARCH}.exe
    SIGN_TYPE: WIN
  artifacts:
    paths:
      - ${DOWNLOAD_DIR}/${TARGET}_windows_${ARCH}.exe

sign-osx:
  extends:
    - .trigger-filter
    - .submit-signing-request
  retry: 2
  needs:
    - compile
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  variables:
    ARTIFACT: bin/packages.tar.gz
    SIGN_TYPE: OSX
    OPTIONS: archive
    DOWNLOAD_DIR: dist/signed
  before_script:
    - mkdir -p dist
    - pushd bin && tar -czvf packages.tar.gz otelcol_darwin_${ARCH} && popd
  after_script:
    - tar -xzvf dist/signed/packages.tar.gz -C dist/signed/
    - rm dist/signed/packages.tar.gz
  artifacts:
    paths:
      - dist/signed/otelcol_darwin_${ARCH}

.build-tar-deb-rpm:
  needs:
    - compile
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  id_tokens:  # http://go/gitlab-17
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  before_script:
    - ./packaging/fpm/install-deps.sh
  script:
    - |
      VERSION_TAG="${RELEASE_VERSION:-${CI_COMMIT_TAG:-}}"
      ./packaging/fpm/${PKG_TYPE}/build.sh "${VERSION_TAG}" "$ARCH" "./dist"
    - *xray-publish-package

build-deb:
  extends:
    - .trigger-filter
    - .build-tar-deb-rpm
  variables:
    PKG_TYPE: deb
  artifacts:
    paths:
      - dist/*.deb
      - xray_artifact_path

xray-collector-deb:
  extends: .xray-scan-package
  needs:
    - build-deb
  parallel:
    matrix:
      - ARCH: [amd64, arm64]

build-rpm:
  extends:
    - .trigger-filter
    - .build-tar-deb-rpm
  variables:
    PKG_TYPE: rpm
  artifacts:
    paths:
      - dist/*.rpm
      - xray_artifact_path

xray-collector-rpm:
  extends: .xray-scan-package
  needs:
    - build-rpm
  parallel:
    matrix:
      - ARCH: [amd64, arm64]

build-tar:
  extends:
    - .trigger-filter
    - .build-tar-deb-rpm
  variables:
    PKG_TYPE: tar
  artifacts:
    paths:
      - dist/splunk-otel-collector*.tar.gz

pack-otlpinput:
  extends:
    - .trigger-filter
    - .go-cache
  needs:
    - job: sign-exe
      artifacts: true
    - job: compile
      artifacts: true
  script:
    - |
      VERSION_TAG="${RELEASE_VERSION:-${CI_COMMIT_TAG:-}}"
      if [[ -n "${VERSION_TAG:-}" ]]; then
        export VERSION="${VERSION_TAG}"
      fi
      echo "VERSION is set to $VERSION"
    - cd packaging/otlpinput && make tgz
  artifacts:
    paths:
      - packaging/otlpinput/out/distribution/

pack-ta-v2:
  extends:
    - .trigger-filter
    - .go-cache
  needs:
    - job: sign-exe
      artifacts: true
    - job: compile
      artifacts: true
  script:
