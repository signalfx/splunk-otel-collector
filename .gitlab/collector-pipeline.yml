verify-signed-packages:
  extends: .trigger-filter
  needs:
    - build-deb
    - build-rpm
    - build-msi
    - build-tar
    - instrumentation-deb
    - instrumentation-rpm
    - sign-debs
    - sign-rpms
    - sign-msi
    - sign-tar
    - sign-ps-installer
  script:
    - |
      set -ex
      for pkg in dist/*.rpm dist/*.deb dist/*.msi dist/*.tar.gz dist/install.ps1; do
        if [[ ! -f dist/signed/$(basename $pkg) ]]; then
          echo "$pkg was not signed!" >&2
          exit 1
        fi
        if [[ "${pkg##*.}" =~ gz ]] && [[ ! -f dist/signed/$(basename $pkg).asc ]]; then
          echo "$pkg was not signed!" >&2
          exit 1
        fi
      done

build-push-linux-image:
  extends: .docker-publish-rules
  needs:
    - job: compile
      artifacts: true
  retry: 2
  id_tokens:  # http://go/gitlab-17
    CI_JOB_JWT:
      aud: $CICD_VAULT_ADDR
  variables:
    DOCKER_ARCHES: amd64,arm64,ppc64le
    DOCKER_FIPS_SUFFIX: ""
  script: &build-push-linux-docker
    - *docker-reader-role
    - *collector-docker-functions
    - login_to_quay
    - *set-docker-tags
    - |
      set -eo pipefail
      artifact_dir="dist/docker/${QUAY_COLLECTOR_REPO}"
      mkdir -p "$artifact_dir"
      fips=false
      if [[ -n "$DOCKER_FIPS_SUFFIX" ]]; then
        fips=true
      fi
      image_name="${QUAY_COLLECTOR_REPO}${DOCKER_FIPS_SUFFIX}"
      if [[ -z "$VERSION_TAG" ]]; then
        image_name="${image_name}-dev"
      fi

      linux_tag="$IMAGE_TAG"
      if [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        # Keep the Linux index tagged for retries of the multiarch job.
        linux_tag="${IMAGE_TAG}-linux"
      fi
      echo "Building and pushing ${image_name}:${linux_tag}"
      make docker-otelcol FIPS="$fips" ARCH="$DOCKER_ARCHES" DOCKER_REPO="$DOCKER_HUB_REPO" \
        IMAGE_NAME="$image_name" IMAGE_TAG="$linux_tag" IMAGE_METADATA_FILE=build_metadata.json \
        SKIP_COMPILE=true PUSH=true
      linux_digest="$(read_build_digest build_metadata.json)"
      printf '%s@%s\n' "$image_name" "$linux_digest" > "${artifact_dir}/linux_index${DOCKER_FIPS_SUFFIX}"
      json="$(docker buildx imagetools inspect --raw "${image_name}@${linux_digest}")"

      # Preserve the legacy single-architecture tags.
      IFS=, read -r -a arches <<< "$DOCKER_ARCHES"
      for arch in "${arches[@]}"; do
        image="${image_name}:${IMAGE_TAG}-${arch}"
        jq -er --arg arch "$arch" '.manifests[] | select(.platform.architecture == $arch and .platform.os == "linux")' \
          <<< "$json" > descriptor.json
        digest="$(push_collector_index "$image" --file descriptor.json)"
        printf '%s %s\n' "$image" "$digest" > "${artifact_dir}/tags_to_sign_${arch}${DOCKER_FIPS_SUFFIX}"
      done
  artifacts:
    paths:
      - dist/docker/${QUAY_COLLECTOR_REPO}/linux_index
      - dist/docker/${QUAY_COLLECTOR_REPO}/tags_to_sign_*

build-push-linux-fips-image:
  extends: .docker-publish-rules
