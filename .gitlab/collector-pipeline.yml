build-push-windows-image:
  extends: .docker-publish-rules
  parallel:
    matrix:
      - WIN_VERSION: ["2019", "2022"]
  needs:
    - job: sign-exe
      artifacts: true
  tags:
    - windows${WIN_VERSION}
  image: mcr.microsoft.com/windows/servercore:ltsc${WIN_VERSION}
  retry: 2
  variables:
    ErrorActionPreference: stop
    DOCKER_FIPS_SUFFIX: ""
  before_script:
    - . .gitlab/windows/runner-setup-helpers.ps1
    - Install-Chocolatey
    - Install-DockerCli
    - Copy-Item .\dist\signed\otelcol_windows_amd64.exe .\cmd\otelcol\otelcol.exe
    - |
      if ($env:WIN_VERSION -eq "2019") {
        $BASE_IMAGE = $env:WIN_2019_BASE_IMAGE
      } else {
        $BASE_IMAGE = $env:WIN_2022_BASE_IMAGE
      }
    - |
      docker pull $BASE_IMAGE
      if ($LASTEXITCODE -ne 0) { exit 1 }
  script:
    - &setup-windows-docker |
      . .gitlab/windows/collector-docker-publish.ps1
      Connect-CollectorQuay
      $VERSION_TAG = if (-not $env:DRY_RUN) {
        if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { $env:CI_COMMIT_TAG }
      }
      $IMAGE_NAME = "${env:QUAY_COLLECTOR_REPO}${env:DOCKER_FIPS_SUFFIX}"
      $OLD_IMAGE_NAME = "${IMAGE_NAME}-windows"
      if ($VERSION_TAG) {
        $tagNumber = $VERSION_TAG.TrimStart("v")
      } else {
        $IMAGE_NAME = "${IMAGE_NAME}-dev"
        $OLD_IMAGE_NAME = "${OLD_IMAGE_NAME}-dev"
        $tagNumber = $env:CI_COMMIT_SHA
      }
      if ($env:DRY_RUN) {
        $tagNumber = "${tagNumber}-dryrun-${env:CI_PIPELINE_ID}"
      } elseif ($VERSION_TAG -cmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
        if (-not $env:CI_PIPELINE_ID) { throw 'CI_PIPELINE_ID is required for stable image staging' }
        $tagNumber = "${tagNumber}-staging-${env:CI_PIPELINE_ID}"
      }
      $IMAGE_TAG = "${tagNumber}-${env:WIN_VERSION}"
    - |
      echo "Building ${IMAGE_NAME}:${IMAGE_TAG}"
      docker build -t ${IMAGE_NAME}:${IMAGE_TAG} --build-arg BASE_IMAGE=${BASE_IMAGE} -f .\cmd\otelcol\Dockerfile.windows .\cmd\otelcol\
      if ($LASTEXITCODE -ne 0) { exit 1 }
    - &publish-windows-docker |
      $osVersion = (docker manifest inspect $BASE_IMAGE | ConvertFrom-Json).manifests[0].platform."os.version"
      if ($LASTEXITCODE -ne 0 -or -not $osVersion) { throw "Could not read the OS version of $BASE_IMAGE" }
      $imageRecord = Publish-CollectorWindowsManifest $IMAGE_NAME $IMAGE_TAG $osVersion
      docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${OLD_IMAGE_NAME}:${IMAGE_TAG}
      if ($LASTEXITCODE -ne 0) { exit 1 }
      $legacyRecord = Publish-CollectorWindowsManifest $OLD_IMAGE_NAME $IMAGE_TAG $osVersion
      $tagFile = "dist/docker/${env:QUAY_COLLECTOR_REPO}/tags_to_sign_${env:WIN_VERSION}${env:DOCKER_FIPS_SUFFIX}"
      New-Item -ItemType Directory -Force -Path (Split-Path -Parent $tagFile) | Out-Null
      ($imageRecord, $legacyRecord -join [char]10) + [char]10 |
        Set-Content -Encoding ascii -NoNewline -Path $tagFile
  artifacts:
    paths:
      - dist/docker/${QUAY_COLLECTOR_REPO}/tags_to_sign_${WIN_VERSION}

