receivers:
  windows_event_log:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="Application">*</Select>
          <Suppress Path="Application">*[System[Provider[@Name='XENAGENT']]]</Suppress>
          <Suppress Path="Application">*[System[Provider[@Name='Tenable Nessus Agent']]]</Suppress>
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true
    # Suppresses events from providers whose metadata DLL is not accessible
    # to the collector process.
    # Remove the Suppress clause if you want to collect those events despite
    # the error.

  windows_event_log/security:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="Security">*</Select>
          <!--
          <Suppress Path="Security">*[System[EventID=4662]]</Suppress>
          <Suppress Path="Security">*[System[EventID=566]]</Suppress>
          -->
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true
    # NOTE: Splunk blacklists the following with a message-body regex condition:
    #   EventCode 4662 where Object Type != groupPolicyContainer
    #   EventCode 566  where Object Type != groupPolicyContainer
    # The commented Suppress clause in the query above would drop ALL
    # 4662/566 events. It cannot replicate the groupPolicyContainer exception.
    # Use a filterprocessor with OTTL if you need conditional filtering.

  windows_event_log/system:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="System">*</Select>
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true

  windows_event_log/printservice:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="Microsoft-Windows-PrintService/Operational">*</Select>
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true

  # --- Disabled in inputs.conf -------------------------------------------

  # ForwardedEvents exists but is disabled — enable on WEF collectors only
  windows_event_log/forwardedevents:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="ForwardedEvents">*</Select>
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true

  # DC-only channels — will silently no-op on non-DC machines due to ignore_channel_errors
  windows_event_log/dfs_replication:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="DFS Replication">*</Select>
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true

  windows_event_log/directory_service:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="Directory Service">*</Select>
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true

  windows_event_log/file_replication:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="File Replication Service">*</Select>
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true

  windows_event_log/dns_server:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="DNS Server">*</Select>
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true

  windows_event_log/key_management:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="Key Management Service">*</Select>
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true

  windows_event_log/defender:
    query: |
      <QueryList>
        <Query Id="0">
          <Select Path="Microsoft-Windows-Windows Defender/Operational">*</Select>
        </Query>
      </QueryList>
    start_at: beginning
    raw: true
    ignore_channel_errors: true

  file_log/dhcp:
    include:
      - '${env:SystemRoot}\System32\DHCP\DhcpSrvLog*'
    start_at: beginning
    include_file_path: true
    operators:
      - type: move
        from: attributes["log.file.path"]
        to: resource["com.splunk.source"]
      - type: add
        field: resource["com.splunk.sourcetype"]
        value: DhcpSrvLog
    storage: file_storage/filelogs

  file_log/windowsupdate_legacy:
    # For Windows 8 / Server 2008R2 / Server 2012 / Server 2012R2
    include:
      - '${env:SystemRoot}\WindowsUpdate.log'
    start_at: beginning
    include_file_path: true
    operators:
      - type: move
        from: attributes["log.file.path"]
        to: resource["com.splunk.source"]
      - type: add
        field: resource["com.splunk.sourcetype"]
        value: WindowsUpdateLog
    storage: file_storage/filelogs

  file_log/netlogon:
    include:
      - '${env:SystemRoot}\debug\netlogon.log'
    start_at: beginning
    include_file_path: true
    operators:
      - type: move
        from: attributes["log.file.path"]
        to: resource["com.splunk.source"]
      - type: add
        field: resource["com.splunk.sourcetype"]
        value: MSAD:NT6:Netlogon
    storage: file_storage/filelogs

  file_log/firewall:
    include:
      - '${env:SystemRoot}\System32\LogFiles\Firewall\*'
    start_at: beginning
    include_file_path: true
    operators:
      - type: move
        from: attributes["log.file.path"]
        to: resource["com.splunk.source"]
      - type: add
        field: resource["com.splunk.sourcetype"]
        value: WindowsFirewallLog
    storage: file_storage/filelogs

  #   --- GAP: dns.log (MonitorNoHandle) ------------------------------------
  #   [MonitorNoHandle://$WINDIR\System32\Dns\dns.log]
  #   The live DNS debug log is held open with an exclusive lock by the DNS
  #   service. filelogreceiver cannot reliably read exclusively locked files.
  #   Workaround: use a scheduled task to periodically copy dns.log to a
  #   staging path, then monitor that path with file_log.

  #  file_log/dns_debug:
  #    include:
  #      - '${env:SystemDrive}\dns_log_copy\dns.log'
  #    start_at: beginning
  #    include_file_path: true
  #    operators:
  #      - type: move
  #        from: attributes["log.file.path"]
  #        to: resource["com.splunk.source"]
  #      - type: add
  #        field: resource["com.splunk.sourcetype"]
  #        value: MSAD:NT6:DNS
  #    storage: file_storage/filelogs

processors:
  resource_detection:
    detectors: [gcp, ecs, ec2, azure, system]
    override: true

  # WinEventLog://Application -> sourcetype=XmlWinEventLog  source=WinEventLog:Application
  transform/application:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "XmlWinEventLog")
          - set(attributes["com.splunk.source"], "XmlWinEventLog:Application")
  # WinEventLog://Security -> sourcetype=XmlWinEventLog  source=WinEventLog:Security
  transform/security:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "XmlWinEventLog")
          - set(attributes["com.splunk.source"], "XmlWinEventLog:Security")
  # WinEventLog://System -> sourcetype=XmlWinEventLog  source=WinEventLog:System
  transform/system:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "XmlWinEventLog")
          - set(attributes["com.splunk.source"], "XmlWinEventLog:System")
  # WinEventLog://Microsoft-Windows-PrintService/Operational
  # No renderXml in inputs.conf -> sourcetype=WinEventLog
  transform/printservice:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "WinEventLog")
          - set(attributes["com.splunk.source"], "WinEventLog:Microsoft-Windows-PrintService/Operational")
  # transform/forwardedevents — uncomment if enabling ForwardedEvents receiver
  transform/forwardedevents:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "XmlWinEventLog")
          - set(attributes["com.splunk.source"], "XmlWinEventLog:ForwardedEvents")
  transform/dfs_replication:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "XmlWinEventLog")
          - set(attributes["com.splunk.source"], "XmlWinEventLog:DFS Replication")
  transform/directory_service:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "XmlWinEventLog")
          - set(attributes["com.splunk.source"], "XmlWinEventLog:Directory Service")
  transform/file_replication:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "XmlWinEventLog")
          - set(attributes["com.splunk.source"], "XmlWinEventLog:File Replication Service")
  transform/dns_server:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "XmlWinEventLog")
          - set(attributes["com.splunk.source"], "XmlWinEventLog:DNS Server")
  transform/key_management:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "XmlWinEventLog")
          - set(attributes["com.splunk.source"], "XmlWinEventLog:Key Management Service")
  transform/defender:
    log_statements:
      - context: log
        statements:
          - set(attributes["com.splunk.sourcetype"], "XmlWinEventLog")
          - set(attributes["com.splunk.source"], "XmlWinEventLog:Microsoft-Windows-Windows Defender/Operational")


exporters:
  splunk_hec/logs:
    endpoint: "${SPLUNK_PLATFORM_URL}"
    token: "${SPLUNK_PLATFORM_TOKEN}"
    source: "otel"
    index: "${SPLUNK_PLATFORM_LOGS_INDEX}"
    splunk_app_name: "splunk-otel-collector"
    disable_compression: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_elapsed_time: 300s
      max_interval: 30s
    sending_queue:
      enabled: true
      block_on_overflow: true
      num_consumers: 10
      queue_size: 10000
      sizer: items
      batch:
        flush_timeout: 200ms
        min_size: 2048
    tls:
      insecure_skip_verify: false

extensions:
  file_storage/filelogs:
    directory: "${ProgramData}/Splunk/OpenTelemetry Collector/FileStorage"
    compaction:
      on_start: true
      directory: ${env:TEMP}
    create_directory: true

service:
  extensions: [file_storage/filelogs]
  pipelines:
    logs/application:
      receivers: [windows_event_log]
      processors: [transform/application, resource_detection]
      exporters: [splunk_hec/logs]
    logs/security:
      receivers: [windows_event_log/security]
      processors: [transform/security, resource_detection]
      exporters: [splunk_hec/logs]
    logs/system:
      receivers: [windows_event_log/system]
      processors: [transform/system, resource_detection]
      exporters: [splunk_hec/logs]
    logs/printservice:
      receivers: [windows_event_log/printservice]
      processors: [transform/printservice, resource_detection]
      exporters: [splunk_hec/logs]
    logs/forwardedevents:
      receivers: [windows_event_log/forwardedevents]
      processors: [transform/forwardedevents, resource_detection]
      exporters: [splunk_hec/logs]
    logs/dfs_replication:
      receivers: [windows_event_log/dfs_replication]
      processors: [transform/dfs_replication, resource_detection]
      exporters: [splunk_hec/logs]
    logs/directory_service:
      receivers: [windows_event_log/directory_service]
      processors: [transform/directory_service, resource_detection]
      exporters: [splunk_hec/logs]
    logs/file_replication:
      receivers: [windows_event_log/file_replication]
      processors: [transform/file_replication, resource_detection]
      exporters: [splunk_hec/logs]
    logs/dns_server:
      receivers: [windows_event_log/dns_server]
      processors: [transform/dns_server, resource_detection]
      exporters: [splunk_hec/logs]
    logs/key_management:
      receivers: [windows_event_log/key_management]
      processors: [transform/key_management, resource_detection]
      exporters: [splunk_hec/logs]
    logs/defender:
      receivers: [windows_event_log/defender]
      processors: [transform/defender, resource_detection]
      exporters: [splunk_hec/logs]
    logs/dhcp:
      receivers: [file_log/dhcp]
      processors: [resource_detection]
      exporters: [splunk_hec/logs]
    logs/windowsupdate:
      receivers: [file_log/windowsupdate_legacy]
      processors: [resource_detection]
      exporters: [splunk_hec/logs]
    logs/netlogon:
      receivers: [file_log/netlogon]
      processors: [resource_detection]
      exporters: [splunk_hec/logs]
    logs/firewall:
      receivers: [file_log/firewall]
      processors: [resource_detection]
      exporters: [splunk_hec/logs]
