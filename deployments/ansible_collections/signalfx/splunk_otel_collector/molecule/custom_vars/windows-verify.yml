---
- name: Verify scenario with custom variables
  hosts: all
  gather_facts: true
  become: no
  vars:
    collector_reg_values:
      SPLUNK_INGEST_URL: https://fake-splunk-ingest.com
      SPLUNK_API_URL: https://fake-splunk-api.com
      SPLUNK_HEC_URL: https://fake-splunk-hec.com
      SPLUNK_HEC_TOKEN: fake-hec-token
      SPLUNK_MEMORY_TOTAL_MIB: "256"
      SPLUNK_PLATFORM_URL: https://fake-splunk-platform.example.com:8088/services/collector
      SPLUNK_PLATFORM_TOKEN: fake-platform-token
      SPLUNK_MEMORY_LIMIT_MIB: "230"
      GOMEMLIMIT: 230
      MY_CUSTOM_VAR1: value1
      MY_CUSTOM_VAR2: value2
    iis_reg_values:
      COR_ENABLE_PROFILING: "1"
      COR_PROFILER: "{918728DD-259F-4A6A-AC2B-B85E1B658318}"
      CORECLR_ENABLE_PROFILING: "1"
      CORECLR_PROFILER: "{918728DD-259F-4A6A-AC2B-B85E1B658318}"
      OTEL_RESOURCE_ATTRIBUTES: >-
        deployment.environment.name=test-environment,dotnet-tag=dotnet-tag-value,splunk.zc.method=splunk-otel-dotnet-1.9.0
      OTEL_SERVICE_NAME: "test-service-name"
      SPLUNK_PROFILER_ENABLED: "true"
      SPLUNK_PROFILER_MEMORY_ENABLED: "true"
      SPLUNK_DOTNET_VAR1: dotnet-value1
      SPLUNK_DOTNET_VAR2: dotnet-value2
  tasks:
    - name: Check splunk-otel-collector service
      ansible.windows.win_service:
        name: splunk-otel-collector
        state: started
      check_mode: yes
      register: service_status

    - name: Check custom_config.yml
      ansible.windows.win_stat:
        path: '{{ ansible_env.ProgramData }}\Splunk\OpenTelemetry Collector\custom_config.yml'
      register: custom_collector_config

    - name: Assert custom_config.yml exists
      ansible.builtin.assert:
        that: custom_collector_config.stat.exists

    - name: Check packaged Splunk Platform logs config
      ansible.windows.win_stat:
        path: '{{ ansible_env.ProgramData }}\Splunk\OpenTelemetry Collector\splunk_logs_config_windows.yaml'
      register: splunk_platform_logs_config

    - name: Assert packaged Splunk Platform logs config exists
      ansible.builtin.assert:
        that: splunk_platform_logs_config.stat.exists

    - name: Get IIS env vars
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\W3SVC
        name: Environment
      register: iis_env

    - name: Verify IIS env vars
      ansible.builtin.assert:
        that: (item.key + '=' + (item.value | string)) in iis_env.value
      loop: "{{ iis_reg_values | dict2items }}"

    - name: Get splunk-otel-collector service env vars
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\splunk-otel-collector
        name: Environment
      register: collector_env

    - name: Verify splunk-otel-collector service env vars
      ansible.builtin.assert:
        that: (item.key + '=' + (item.value | string)) in collector_env.value
      loop: "{{ collector_reg_values | dict2items }}"

    - name: Assert Splunk Platform logs index is omitted
      ansible.builtin.assert:
        that: "'SPLUNK_PLATFORM_LOGS_INDEX=' not in collector_env.value"

    - name: Get splunk-otel-collector service ImagePath
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\splunk-otel-collector
        name: ImagePath
      register: collector_imagepath

    - name: Assert service ImagePath contains the custom command line args and the SPLUNK_CONFIG --config value
      ansible.builtin.assert:
        that:
          - "'--discovery --set=processors.batch.timeout=10s' in collector_imagepath.value"
          - "'--feature-gates=confmap.enableMergeAppendOption' in collector_imagepath.value"
          - "'splunk_logs_config_windows.yaml' in collector_imagepath.value"
          - "'custom_config.yml' in collector_imagepath.value"
