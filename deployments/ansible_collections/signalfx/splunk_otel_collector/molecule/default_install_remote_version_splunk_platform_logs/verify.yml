---
- name: Verify scenario with the default configuration, remote version and Splunk Platform logs
  hosts: all
  gather_facts: true
  tasks:
    - name: Import shared verification tasks
      ansible.builtin.import_tasks: ../shared/verify_tasks.yml

    - name: Assert SPLUNK_ACCESS_TOKEN env var is set
      ansible.builtin.lineinfile:
        line: SPLUNK_ACCESS_TOKEN=fake-token
        dest: /etc/otel/collector/splunk-otel-collector.conf
        state: present
      check_mode: yes
      register: config
      failed_when: config is changed

    - name: Assert SPLUNK_REALM env var is set
      ansible.builtin.lineinfile:
        line: SPLUNK_REALM=fake-realm
        dest: /etc/otel/collector/splunk-otel-collector.conf
        state: present
      check_mode: yes
      register: config
      failed_when: config is changed

    - name: Assert SPLUNK_INGEST_URL env var is set
      ansible.builtin.lineinfile:
        line: SPLUNK_INGEST_URL=https://ingest.fake-realm.observability.splunkcloud.com
        dest: /etc/otel/collector/splunk-otel-collector.conf
        state: present
      check_mode: yes
      register: config
      failed_when: config is changed

    - name: Assert SPLUNK_API_URL env var is set
      ansible.builtin.lineinfile:
        line: SPLUNK_API_URL=https://api.fake-realm.observability.splunkcloud.com
        dest: /etc/otel/collector/splunk-otel-collector.conf
        state: present
      check_mode: yes
      register: config
      failed_when: config is changed

    - name: Assert SPLUNK_HEC_URL env var is set
      ansible.builtin.lineinfile:
        line: SPLUNK_HEC_URL=https://ingest.fake-realm.observability.splunkcloud.com/v1/log
        dest: /etc/otel/collector/splunk-otel-collector.conf
        state: present
      check_mode: yes
      register: config
      failed_when: config is changed

    - name: Assert OTELCOL_OPTIONS env var is set with the confmap merge-append feature gate
      ansible.builtin.lineinfile:
        line: OTELCOL_OPTIONS=--feature-gates=confmap.enableMergeAppendOption
        dest: /etc/otel/collector/splunk-otel-collector.conf
        state: present
      check_mode: yes
      register: config
      failed_when: config is changed

    - name: Assert SPLUNK_PLATFORM_URL env var is set
      ansible.builtin.lineinfile:
        line: SPLUNK_PLATFORM_URL=https://fake-splunk-platform.example.com:8088/services/collector
        dest: /etc/otel/collector/splunk-otel-collector.conf
        state: present
      check_mode: yes
      register: config
      failed_when: config is changed

    - name: Assert SPLUNK_PLATFORM_TOKEN env var is set
      ansible.builtin.lineinfile:
        line: SPLUNK_PLATFORM_TOKEN=fake-platform-token
        dest: /etc/otel/collector/splunk-otel-collector.conf
        state: present
      check_mode: yes
      register: config
      failed_when: config is changed

    - name: Re-populate service facts
      ansible.builtin.service_facts:

    - name: Assert splunk-otel-collector service is still running
      ansible.builtin.assert:
        that: ansible_facts.services['splunk-otel-collector.service'].state == 'running'
