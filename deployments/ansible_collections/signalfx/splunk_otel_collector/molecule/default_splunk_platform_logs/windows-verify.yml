---
- name: Verify scenario with the default configuration and Splunk Platform logs
  hosts: all
  gather_facts: true
  become: no
  vars:
    collector_reg_values:
      SPLUNK_ACCESS_TOKEN: fake-token
      SPLUNK_REALM: fake-realm
      SPLUNK_API_URL: https://api.fake-realm.observability.splunkcloud.com
      SPLUNK_HEC_TOKEN: fake-token
      SPLUNK_HEC_URL: https://ingest.fake-realm.observability.splunkcloud.com/v1/log
      SPLUNK_INGEST_URL: https://ingest.fake-realm.observability.splunkcloud.com
      SPLUNK_PLATFORM_URL: https://fake-splunk-platform.example.com:8088/services/collector
      SPLUNK_PLATFORM_TOKEN: fake-platform-token
  tasks:
    - name: Check splunk-otel-collector service
      ansible.windows.win_service:
        name: splunk-otel-collector
        state: started
      check_mode: yes
      register: service_status

    - name: Get splunk-otel-collector service env vars
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\splunk-otel-collector
        name: Environment
      register: collector_env

    - name: Verify splunk-otel-collector service env vars
      ansible.builtin.assert:
        that: (item.key + '=' + (item.value | string)) in collector_env.value
      loop: "{{ collector_reg_values | dict2items }}"

    - name: Get splunk-otel-collector service ImagePath
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\splunk-otel-collector
        name: ImagePath
      register: collector_imagepath

    - name: Assert the default config and feature gate are passed to the collector service via its arguments
      ansible.builtin.assert:
        that:
          - "'--config' in collector_imagepath.value"
          - "'agent_config.yaml' in collector_imagepath.value"
          - "'--feature-gates=confmap.enableMergeAppendOption' in collector_imagepath.value"

    - name: Check splunk-otel-collector service is still running
      ansible.windows.win_service:
        name: splunk-otel-collector
        state: started
      check_mode: yes
      register: final_service_status

    - name: Assert splunk-otel-collector service is still running
      ansible.builtin.assert:
        that: not final_service_status.changed
