---
- name: Converge scenario with Splunk Platform log collection only
  hosts: all
  become: yes
  vars:
    local_artifact_testing_enabled: true
    splunk_access_token: ""
    splunk_platform_token: fake-platform-token
    splunk_platform_url: https://splunk.example.com:8088/services/collector
    start_service: false
  tasks:
    - name: Include signalfx.splunk_otel_collector.collector role
      ansible.builtin.include_role:
        name: signalfx.splunk_otel_collector.collector
