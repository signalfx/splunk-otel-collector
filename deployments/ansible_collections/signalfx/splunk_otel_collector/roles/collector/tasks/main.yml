---

- name: Make sure a supported collector token configuration is provided
  ansible.builtin.assert:
    that:
      - >-
        (splunk_access_token | default('') | trim != '') or
        (splunk_platform_url | default('') | trim != '' and
        splunk_platform_token | default('') | trim != '')
    fail_msg: >-
      Provide splunk_access_token for Splunk Observability and/or both
      splunk_platform_url and splunk_platform_token for Splunk Platform.

- name: Validate Splunk Platform log collection settings
  ansible.builtin.assert:
    that:
      - (splunk_platform_url | default('') | trim == '') or (splunk_platform_token | default('') | trim != '')
      - (splunk_platform_token | default('') | trim == '') or (splunk_platform_url | default('') | trim != '')
      - (splunk_platform_logs_index | default('') | trim == '') or (splunk_platform_url | default('') | trim != '')
    fail_msg: >-
      splunk_platform_url and splunk_platform_token must be provided together;
      splunk_platform_logs_index requires splunk_platform_url.

- name: Make sure host OS is supported
  ansible.builtin.assert:
    that: ansible_os_family in ["Debian", "RedHat", "Windows", "Suse"]
    fail_msg: "{{ ansible_os_family }} OS family currently is not supported"

- name: Set Vars based on ansible_os_family
  ansible.builtin.import_tasks: vars.yml

- name: Reject gateway config with Splunk Platform log collection
  ansible.builtin.assert:
    that:
      - >-
        (splunk_platform_url | default('') | trim == '') or
        ((splunk_otel_collector_config | replace('\\', '/') | basename) != 'gateway_config.yaml')
    fail_msg: Splunk Platform log collection is only supported in agent mode; use the agent config instead of gateway_config.yaml.

- name: Linux deployment
  ansible.builtin.import_tasks: linux_install.yml
  when: ansible_os_family != "Windows"

- name: Windows deployment
  ansible.builtin.import_tasks: win_install.yml
  when: ansible_os_family == "Windows"
