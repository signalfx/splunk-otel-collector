filter_set_include:
  resource_attributes:
    nutanix.prism.api.version:
      enabled: true
      metrics_include:
        - regexp: ".*"
    server.address:
      enabled: true
      metrics_include:
        - regexp: ".*"
    server.port:
      enabled: true
      metrics_include:
        - regexp: ".*"
    service.instance.id:
      enabled: true
      metrics_include:
        - regexp: ".*"
    service.name:
      enabled: true
      metrics_include:
        - regexp: ".*"
filter_set_exclude:
  resource_attributes:
    nutanix.prism.api.version:
      enabled: true
      metrics_exclude:
        - strict: "nutanix.prism.api.version-val"
    server.address:
      enabled: true
      metrics_exclude:
        - strict: "server.address-val"
    server.port:
      enabled: true
      metrics_exclude:
        - regexp: ".*"
    service.instance.id:
      enabled: true
      metrics_exclude:
        - strict: "service.instance.id-val"
    service.name:
      enabled: true
      metrics_exclude:
        - strict: "service.name-val"
