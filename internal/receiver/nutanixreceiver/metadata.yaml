type: nutanix
display_name: Nutanix Receiver
description: Collects Nutanix Prism Element v2.0 or Prism Central v4 inventory and statistics.

status:
  class: receiver
  stability:
    alpha: [metrics]
  distributions: [splunk]
  codeowners:
    active: [akhi85]

tests:
  config:
    endpoint: https://prism.example.com:9440
    username: readonly
    password: secret

resource_attributes:
  nutanix.prism.api.version:
    description: Nutanix Prism API version used by the receiver.
    type: string
    enabled: true

  server.address:
    description: Hostname or IP address of the Nutanix Prism endpoint.
    type: string
    enabled: true

  server.port:
    description: Port of the Nutanix Prism endpoint.
    type: int
    enabled: true

  service.instance.id:
    description: Identifies the Nutanix Prism endpoint producing the metrics.
    type: string
    enabled: true

  service.name:
    description: Identifies the Nutanix Prism service producing the metrics.
    type: string
    enabled: true

attributes:
  nutanix.cluster.id:
    description: Unique identifier of the Nutanix cluster.
    type: string

  nutanix.cluster.name:
    description: Name of the Nutanix cluster.
    type: string

  nutanix.data_protection.protected_vm.rpo:
    description: Recovery point objective class of the protection policy protecting the virtual machine.
    type: string
    enum: [sync, nearsync, async]

  nutanix.data_protection.protection_policy_schedule.consistency:
    description: Consistency type configured for the data protection policy schedule.
    type: string
    enum: [crash_consistent, application_consistent]

  nutanix.data_protection.protection_policy_schedule.rpo:
    description: Recovery point objective class configured for the data protection policy schedule.
    type: string
    enum: [sync, nearsync, async]

  nutanix.disk.id:
    description: Unique identifier of the Nutanix physical disk.
    type: string

  nutanix.disk.serial:
    description: Serial number of the Nutanix physical disk.
    type: string

  nutanix.disk.storage_tier:
    description: Storage tier of the Nutanix physical disk.
    type: string
    enum: [ssd_pcie, ssd_sata, das_sata, ssd_mem_nvme, cloud]

  nutanix.files.antivirus_server.id:
    description: Unique identifier of the Nutanix Files antivirus server.
    type: string

  nutanix.files.antivirus_server.name:
    description: Name of the Nutanix Files antivirus server.
    type: string

  nutanix.files.file_server.id:
    description: Unique identifier of the Nutanix Files file server.
    type: string

  nutanix.files.file_server.name:
    description: Name of the Nutanix Files file server.
    type: string

  nutanix.files.mount_target.id:
    description: Unique identifier of the Nutanix Files mount target.
    type: string

  nutanix.files.mount_target.name:
    description: Name of the Nutanix Files mount target.
    type: string

  nutanix.host.id:
    description: Unique identifier of the Nutanix host.
    type: string

  nutanix.host.name:
    description: Name of the Nutanix host.
    type: string

  nutanix.microseg.network_security_policy.scope:
    description: Network scope of the Nutanix network security policy.
    type: string
    enum: [vlan, vpc]

  nutanix.microseg.network_security_policy.state:
    description: Enforcement state of the Nutanix network security policy.
    type: string
    enum: [save, monitor, enforce]

  nutanix.microseg.network_security_policy.type:
    description: Type of the Nutanix network security policy.
    type: string
    enum: [quarantine, isolation, application]

  nutanix.monitoring.alert.acknowledged:
    description: Whether the Nutanix monitoring alert has been acknowledged.
    type: string
    enum: ["true", "false"]

  nutanix.monitoring.alert.resolved:
    description: Whether the Nutanix monitoring alert has been resolved.
    type: string
    enum: ["true", "false"]

  nutanix.monitoring.alert.severity:
    description: Severity of the Nutanix monitoring alert.
    type: string
    enum: [info, warning, critical]

  nutanix.monitoring.alert.unresolved_severity:
    description: Severity of an unresolved Nutanix monitoring alert.
    type: string
    enum: [info, warning, critical]

  nutanix.networking.layer2_stretch.id:
    description: Unique identifier of the Nutanix Layer 2 stretch.
    type: string

  nutanix.networking.layer2_stretch.name:
    description: Name of the Nutanix Layer 2 stretch.
    type: string

  nutanix.networking.traffic_mirror.id:
    description: Unique identifier of the Nutanix traffic mirror.
    type: string

  nutanix.networking.traffic_mirror.name:
    description: Name of the Nutanix traffic mirror.
    type: string

  nutanix.networking.vpc.external_subnet.id:
    description: Unique identifier of the external subnet attached to a Nutanix VPC.
    type: string

  nutanix.networking.vpc.external_subnet.name:
    description: Name of the external subnet attached to a Nutanix VPC.
    type: string

  nutanix.networking.vpc.id:
    description: Unique identifier of the Nutanix VPC containing the external subnet.
    type: string

  nutanix.networking.vpc.name:
    description: Name of the Nutanix VPC containing the external subnet.
    type: string

  nutanix.networking.vpn_connection.id:
    description: Unique identifier of the Nutanix VPN connection.
    type: string

  nutanix.networking.vpn_connection.name:
    description: Name of the Nutanix VPN connection.
    type: string

  nutanix.objects.object_store.id:
    description: Unique identifier of the Nutanix Objects object store.
    type: string

  nutanix.objects.object_store.name:
    description: Name of the Nutanix Objects object store.
    type: string

  nutanix.prism.category.type:
    description: Type of the Nutanix Prism Central category.
    type: string
    enum: [system, user, internal]

  nutanix.prism.task.status:
    description: Status of the Nutanix Prism Central task.
    type: string
    enum: [queued, running, canceling, succeeded, failed, canceled, suspended]

  nutanix.stat.kind:
    description: Kind of statistic returned by the Nutanix Prism API.
    type: string
    enum: [v2.stats, v4.stats]

  nutanix.stat.name:
    description: Name of the statistic returned by the Nutanix Prism API.
    type: string

  nutanix.storage.container.encrypted:
    description: Whether the Nutanix storage container is encrypted.
    type: string
    enum: ["true", "false"]

  nutanix.storage.container.id:
    description: Unique identifier of the Nutanix storage container.
    type: string

  nutanix.storage.container.name:
    description: Name of the Nutanix storage container.
    type: string

  nutanix.storage.container.replication_factor:
    description: Replication factor configured for the Nutanix storage container.
    type: string
    enum: ["1", "2", "3"]

  nutanix.subnet.external:
    description: Whether the Nutanix subnet is external.
    type: string
    enum: ["true", "false"]

  nutanix.subnet.networking_mode:
    description: Whether the Nutanix subnet uses basic or advanced networking.
    type: string
    enum: [basic, advanced]

  nutanix.subnet.type:
    description: Type of the Nutanix subnet.
    type: string
    enum: [overlay, vlan]

  nutanix.vm.boot.type:
    description: Firmware boot type configured for the Nutanix virtual machine.
    type: string
    enum: [legacy, uefi]

  nutanix.vm.disk.bus:
    description: Disk bus type of the Nutanix virtual machine disks.
    type: string
    enum: [ide, sata, scsi]

  nutanix.vm.gpu.present:
    description: Whether the Nutanix virtual machine has at least one GPU.
    type: string
    enum: ["true", "false"]

  nutanix.vm.guest_tools.state:
    description: Nutanix Guest Tools capability counted for virtual machines.
    type: string
    enum: [installed, enabled, reachable, vss_snapshot_capable]

  nutanix.vm.id:
    description: Unique identifier of the Nutanix virtual machine.
    type: string

  nutanix.vm.name:
    description: Name of the Nutanix virtual machine.
    type: string

  nutanix.vm.power_state:
    description: Power state of the Nutanix virtual machine.
    type: string
    enum: [on, off]

  nutanix.vm.protection.type:
    description: Protection type configured for the Nutanix virtual machine.
    type: string
    enum: [unprotected, pd_protected, rule_protected]

  nutanix.volume_group.id:
    description: Unique identifier of the Nutanix volume group.
    type: string

  nutanix.volume_group.name:
    description: Name of the Nutanix volume group.
    type: string

  nutanix.volume_group.sharing_status:
    description: Sharing status of the Nutanix volume group.
    type: string
    enum: [shared, not_shared]

metrics:
  nutanix.cluster.count:
    enabled: true
    description: Number of managed Nutanix clusters.
    stability: alpha
    unit: "{cluster}"
    gauge:
      value_type: double

  nutanix.cluster.info:
    enabled: true
    description: Information marker for a Nutanix cluster.
    stability: alpha
    unit: "1"
    gauge:
      value_type: double
    attributes: [nutanix.cluster.id, nutanix.cluster.name]

  nutanix.cluster.stat:
    enabled: true
    description: Latest Nutanix Prism statistic for a cluster.
    stability: alpha
    unit: ""
    gauge:
      value_type: double
    attributes:
      [nutanix.cluster.id, nutanix.cluster.name, nutanix.stat.name, nutanix.stat.kind]

  nutanix.data_protection.protected_vm.count:
    enabled: true
    description: Number of Nutanix virtual machines protected by a data protection policy.
    stability: alpha
    unit: "{vm}"
    gauge:
      value_type: double
    attributes: [nutanix.data_protection.protected_vm.rpo]

  nutanix.data_protection.protection_policy.count:
    enabled: true
    description: Number of Nutanix data protection policies.
    stability: alpha
    unit: "{policy}"
    gauge:
      value_type: double

  nutanix.data_protection.protection_policy_schedule.count:
    enabled: true
    description: Number of schedules configured for Nutanix data protection policies.
    stability: alpha
    unit: "{schedule}"
    gauge:
      value_type: double
    attributes:
      [nutanix.data_protection.protection_policy_schedule.consistency, nutanix.data_protection.protection_policy_schedule.rpo]

  nutanix.data_protection.recovery_point.count:
    enabled: true
    description: Number of Nutanix data protection recovery points.
    stability: alpha
    unit: "{recovery_point}"
    gauge:
      value_type: double

  nutanix.disk.count:
    enabled: true
    description: Number of Nutanix physical disks.
    stability: alpha
    unit: "{disk}"
    gauge:
      value_type: double
    attributes: [nutanix.cluster.id, nutanix.cluster.name, nutanix.disk.storage_tier]

  nutanix.disk.stat:
    enabled: true
    description: Latest Nutanix Prism statistic for a physical disk.
    stability: alpha
    unit: ""
    gauge:
      value_type: double
    attributes:
      [nutanix.disk.id, nutanix.disk.serial, nutanix.disk.storage_tier, nutanix.host.id, nutanix.host.name, nutanix.cluster.id, nutanix.cluster.name, nutanix.stat.name, nutanix.stat.kind]

  nutanix.files.antivirus_server.count:
    enabled: true
    description: Number of Nutanix Files antivirus servers.
    stability: alpha
    unit: "{server}"
    gauge:
      value_type: double
    attributes: [nutanix.files.file_server.id, nutanix.files.file_server.name]

  nutanix.files.antivirus_server.stat:
    enabled: true
    description: Latest statistic for a Nutanix Files antivirus server.
    stability: alpha
    unit: ""
    gauge:
      value_type: double
    attributes:
      [nutanix.files.antivirus_server.id, nutanix.files.antivirus_server.name, nutanix.files.file_server.id, nutanix.files.file_server.name, nutanix.stat.name, nutanix.stat.kind]

  nutanix.files.file_server.count:
    enabled: true
    description: Number of Nutanix Files file servers.
    stability: alpha
    unit: "{server}"
    gauge:
      value_type: double

  nutanix.files.file_server.stat:
    enabled: true
    description: Latest statistic for a Nutanix Files file server.
    stability: alpha
    unit: ""
    gauge:
      value_type: double
    attributes: [nutanix.files.file_server.id, nutanix.files.file_server.name, nutanix.stat.name, nutanix.stat.kind]

  nutanix.files.mount_target.count:
    enabled: true
    description: Number of Nutanix Files mount targets.
    stability: alpha
    unit: "{target}"
    gauge:
      value_type: double
    attributes: [nutanix.files.file_server.id, nutanix.files.file_server.name]

  nutanix.files.mount_target.stat:
    enabled: true
    description: Latest statistic for a Nutanix Files mount target.
    stability: alpha
    unit: ""
    gauge:
      value_type: double
    attributes:
      [nutanix.files.mount_target.id, nutanix.files.mount_target.name, nutanix.files.file_server.id, nutanix.files.file_server.name, nutanix.stat.name, nutanix.stat.kind]

  nutanix.files.unified_namespace.count:
    enabled: true
    description: Number of Nutanix Files unified namespaces.
    stability: alpha
    unit: "{namespace}"
    gauge:
      value_type: double

  nutanix.host.count:
    enabled: true
    description: Number of Nutanix hosts.
    stability: alpha
    unit: "{host}"
    gauge:
      value_type: double
    attributes: [nutanix.cluster.id, nutanix.cluster.name]

  nutanix.host.stat:
    enabled: true
    description: Latest Nutanix Prism statistic for a host.
    stability: alpha
    unit: ""
    gauge:
      value_type: double
    attributes:
      [nutanix.host.id, nutanix.host.name, nutanix.cluster.id, nutanix.cluster.name, nutanix.stat.name, nutanix.stat.kind]

  nutanix.microseg.address_group.count:
    enabled: true
    description: Number of Nutanix microsegmentation address groups.
    stability: alpha
    unit: "{group}"
    gauge:
      value_type: double

  nutanix.microseg.network_security_policy.count:
    enabled: true
    description: Number of Nutanix network security policies.
    stability: alpha
    unit: "{policy}"
    gauge:
      value_type: double
    attributes:
