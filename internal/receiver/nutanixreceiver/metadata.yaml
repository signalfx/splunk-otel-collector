    gauge:
      value_type: double

  nutanix.monitoring.alert.count:
    enabled: true
    description: Number of Nutanix monitoring alerts.
    stability: alpha
    unit: "{alert}"
    gauge:
      value_type: double
    attributes:
      [nutanix.monitoring.alert.acknowledged, nutanix.monitoring.alert.resolved, nutanix.monitoring.alert.severity, nutanix.monitoring.alert.unresolved_severity]

  nutanix.networking.bgp_session.count:
