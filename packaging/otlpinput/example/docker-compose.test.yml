# Test-only override for docker-compose.yml, used by test-ip-sans.sh (see
# the `test-ip-sans` Makefile target one directory up) to check that the
# server certificate generated by generate-certs.sh carries an IP SAN, not
# just DNS SANs, so a TLS client dialing the receiver by IP address
# succeeds the same way a client dialing it by hostname does.
#
# Bind-mounts an already-extracted, locally built package directly onto the
# app directory instead of installing it via SPLUNK_APPS_URL. Splunk's
# Ansible-based app-install step treats an app directory that already
# exists (e.g. because docker-compose.yml's own local/inputs.conf bind
# mount pre-creates it) as already installed and skips extracting the
# package, so the install-via-URL path can't be used together with that
# override; packaging/ta-v2 bind-mounts its package the same way. Also
# publishes the OTLP HTTP port so the test script can reach it from outside
# the Docker network.
services:
  splunk:
    # splunk/splunk has no arm64 manifest; pin to amd64 (emulated) so the
    # test can run on Apple Silicon dev machines, matching the convention
    # used by packaging/ta-v2's local-run scripts.
    platform: linux/amd64
    environment:
      - SPLUNK_APPS_URL=
    # !override (not merge): the base file's local/inputs.conf bind mount
    # would nest inside this directory mount, which Docker Desktop's
    # virtiofs backend rejects. test-ip-sans.sh writes the TLS-enabling
    # inputs.conf into the extracted package itself instead.
    volumes: !override
      - certs:/certs:ro
      - ${OTLP_PACKAGE_DIR:?set OTLP_PACKAGE_DIR to an extracted splunk-connect-for-otlp package}:/opt/splunk/etc/apps/splunk-connect-for-otlp
    ports:
      - "4318:4318"
