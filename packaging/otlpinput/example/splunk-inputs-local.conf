[splunk-connect-for-otlp://otlp-connector]
enableSSL = 1
grpc_port = 4317
http_port = 4318
listen_address = 0.0.0.0

# HEC token refresh settings (durations, e.g. 3m or 30s).
# max_staleness must exceed refresh_interval + refresh_timeout.
refresh_interval = 3m
refresh_timeout = 30s
max_staleness = 10m

serverCert = /certs/server.crt
serverKey = /certs/server.key
