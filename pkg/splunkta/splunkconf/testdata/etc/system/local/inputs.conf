[monitor:///var/log/foo]
index = main
sourcetype = syslog
disabled = 0
blacklist = \.gz$

[monitor:///var/log/bar with space]
index = secondary

[monitor:///var/log/disabled]
disabled = 1

[tcp://0.0.0.0:5514]
index = net
sourcetype = tcp_source
queueSize = 500KB

[udp://5515]
index = net
sourcetype = udp_source

[batch:///var/lib/batch.txt]
index = batch_logs
move_policy = sinkhole

[WinEventLog://Application]
index = wineventlog
current_only = 1

[tcp-ssl:9998]
index = unsupported_kind

[my_bare_script]
index = unsupported_kind
