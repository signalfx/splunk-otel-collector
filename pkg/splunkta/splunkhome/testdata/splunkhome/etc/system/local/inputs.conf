[monitor:///var/log/foo]
index = main
sourcetype = syslog
disabled = 0

[monitor:///var/log/bar with space]
index = secondary

[monitor:///var/log/disabled]
disabled = 1

[tcp://0.0.0.0:5514]
index = net
sourcetype = tcp_source
queueSize = 500KB

[udp://0.0.0.0:5515]
index = net
sourcetype = udp_source

[script:///usr/local/bin/test.sh]
interval = 30
index = scripts
passAuth = splunk-system-user

[batch:///var/lib/batch.txt]
index = batch_logs
move_policy = sinkhole
