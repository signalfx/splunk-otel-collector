name: "Batch sinkhole"
description: |
  A batched file is consumed: both agents delete it once it has been read. The
  script hook asserts that, since a deletion is a filesystem effect and not an
  event, so the golden cannot carry it. The oracle deletes because of
  move_policy=sinkhole and the candidate because batchreceiver sets
  delete_after_read.
stage: alpha
setup: |
  echo "consumed line" > foo.txt
script: |
  for _ in $(seq 1 60); do
    [ -e foo.txt ] || exit 0
    sleep 0.5
  done
  echo "foo.txt is still here after 30s, so the agent did not consume it" >&2
  exit 1
expected:
  raw: true
  host: true
os: ["darwin", "linux"]
