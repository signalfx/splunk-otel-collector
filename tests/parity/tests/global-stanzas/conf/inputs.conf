# Written above the first stanza header, which inputs.conf.spec makes global.
host = global_host

[default]
index = ${INDEX}
sourcetype = default_st

# Not a defaults stanza for monitor: UF ignores it. If it were honored, a.txt
# would carry kind_st instead of [default]'s sourcetype.
[monitor]
sourcetype = kind_st

[monitor://${BASE_DIR}/a.txt]

[monitor://${BASE_DIR}/b.txt]
sourcetype = own_st
