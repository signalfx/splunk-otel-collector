# httpout posts cooked S2S to the HEC endpoint's /services/collector/s2s. Batch
# settings are forced low so events flush immediately instead of waiting the 30s
# default.
[httpout]
uri = ${HEC_ENDPOINT}
httpEventCollectorToken = ${HEC_TOKEN}
sslVerifyServerCert = false
batchTimeout = 1
batchSize = 1
