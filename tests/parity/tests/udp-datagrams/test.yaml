name: "UDP datagrams"
description: |
  Each datagram sent to a udp stanza's port lands as its own event. The lines
  carry a timestamp because the indexer merges consecutive lines that do not,
  and a case cannot configure the indexer to stop.
script: |
  for _ in $(seq 60); do
    if lsof -nP -iUDP:19101 > /dev/null 2>&1; then
      break
    fi
    sleep 1
  done
  if ! lsof -nP -iUDP:19101; then
    echo "nothing bound port 19101" >&2
    exit 1
  fi
  send_datagram() {
    if ! printf '%s\n' "$1" > /dev/udp/127.0.0.1/19101; then
      echo "failed to send UDP datagram to 127.0.0.1:19101: $1" >&2
      return 1
    fi
  }
  send_datagram '2026-01-02 03:04:05 alpha' || exit 1
  send_datagram '2026-01-02 03:04:06 bravo' || exit 1
  send_datagram '2026-01-02 03:04:07 charlie' || exit 1
expected:
  raw: true
  host: true
  source: true
