receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: custom-platform-config-test
          static_configs:
            - targets: ['127.0.0.1:8888']
processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 512
exporters:
  logging/debug:
    verbosity: detailed
service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter]
      exporters: [logging/debug]
