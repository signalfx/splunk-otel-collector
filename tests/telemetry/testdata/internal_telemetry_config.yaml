receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: internal-telemetry
          scrape_interval: 1s
          static_configs:
            - targets: ["localhost:8888"]
exporters:
  otlp_grpc:
    endpoint: "${OTLP_ENDPOINT}"
    tls:
      insecure: true
service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [otlp_grpc]
